variables:
  AUTO_DEVOPS_ENABLED: "false"
  IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}
  IMAGE_NAME: abco-fe
  CONTAINER_NAME: abco-fe
  HOST_PORT: "8080"
  HTTPS_HOST_PORT: "8443"
  # Pipeline default is plain HTTP with a direct Keycloak, as before TLS support.
  # To deploy over HTTPS set, in Settings > CI/CD > Variables (or here), together:
  #   TLS_MODE=https (or both)
  #   DEPLOY_URL=https://abco.aricoma.local:8443
  #   KEYCLOAK_URL=https://abco.aricoma.local:8443/auth   (nginx proxies /auth to KEYCLOAK_INTERNAL_URL)
  # and prepare Keycloak per docs/keycloak-https-setup.md. See docs/deployment.md.
  TLS_MODE: "http"
  APP_HOST: "abco.aricoma.local"
  CERT_VOLUME: "abco-fe-certs"
  DEPLOY_URL: "http://10.99.99.53:8080"
  # Keycloak config is injected into config.js at container startup (envsubst),
  # not baked into the bundle. Override these in Settings > CI/CD > Variables
  # to point a deployment at a different Keycloak.
  KEYCLOAK_URL: "http://10.99.99.53:8081"
  KEYCLOAK_INTERNAL_URL: "http://10.99.99.53:8081"
  KEYCLOAK_REALM: "aricoma"
  KEYCLOAK_CLIENT_ID: "abcm-fe"
  AUTH_ENABLED: "true"
  # Test server that receives the built image tar (docker save + scp). Credentials come
  # from masked CI/CD variables TEST_SERVER_USER and TEST_SERVER_PASS, never from here.
  TEST_SERVER_HOST: "10.99.99.58"
  TEST_SERVER_DIR: "/home/aricoma"

stages:
  - api-check
  - build-and-deploy
  - check

build-and-deploy:
  stage: build-and-deploy
  tags:
    - deploy-abco
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"'
      when: on_success
    - when: manual
  script:
    - docker build -t ${IMAGE_NAME}:${IMAGE_TAG} -t ${IMAGE_NAME}:latest .
    - |
      # Non-blocking: export the built image to the test server for independent testing.
      # Password auth via a temporary SSH_ASKPASS script (sshpass is not installed on the
      # runners); needs OpenSSH >= 8.4 and setsid. A failure only prints a warning.
      TAR_FILE=/tmp/${IMAGE_NAME}-${IMAGE_TAG}.tar
      ASKPASS_SCRIPT=$(mktemp)
      chmod 700 "$ASKPASS_SCRIPT"
      printf '#!/bin/sh\necho "$TEST_SERVER_PASS"\n' > "$ASKPASS_SCRIPT"
      if docker save ${IMAGE_NAME}:${IMAGE_TAG} -o "$TAR_FILE" \
        && SSH_ASKPASS="$ASKPASS_SCRIPT" SSH_ASKPASS_REQUIRE=force DISPLAY=none setsid -w scp \
          -o StrictHostKeyChecking=no \
          -o PreferredAuthentications=password,keyboard-interactive \
          -o PubkeyAuthentication=no \
          "$TAR_FILE" ${TEST_SERVER_USER}@${TEST_SERVER_HOST}:${TEST_SERVER_DIR}/; then
        echo "OK: image ${IMAGE_NAME}:${IMAGE_TAG} copied to ${TEST_SERVER_HOST}"
      else
        echo "WARNING: image export/scp to ${TEST_SERVER_HOST} failed"
      fi
      rm -f "$ASKPASS_SCRIPT" "$TAR_FILE"
    - docker stop ${CONTAINER_NAME} || true
    - docker rm ${CONTAINER_NAME} || true
    - |
      docker run -d --name ${CONTAINER_NAME} --restart unless-stopped -p ${HOST_PORT}:80 -p ${HTTPS_HOST_PORT}:443 \
        -v ${CERT_VOLUME}:/etc/nginx/certs \
        -e TLS_MODE=${TLS_MODE} \
        -e HTTPS_PUBLIC_PORT=${HTTPS_HOST_PORT} \
        -e KEYCLOAK_URL=${KEYCLOAK_URL} \
        -e KEYCLOAK_INTERNAL_URL=${KEYCLOAK_INTERNAL_URL} \
        -e KEYCLOAK_REALM=${KEYCLOAK_REALM} \
        -e KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID} \
        -e AUTH_ENABLED=${AUTH_ENABLED} \
        ${IMAGE_NAME}:${IMAGE_TAG}
    - docker images ${IMAGE_NAME} --format "{{.Repository}}:{{.Tag}}" | tail -n +6 | xargs -r docker rmi || true
  environment:
    name: production
    url: ${DEPLOY_URL}

verify_deploy:
  stage: check
  tags:
    - deploy-abco
  script:
    - |
      echo "Cakam 10s..."
      sleep 10
      # -k: self-signed certificate; --resolve: the runner is the deploy host, so
      # abco.aricoma.local need not resolve there.
      CURL="curl -sk --resolve ${APP_HOST}:${HTTPS_HOST_PORT}:127.0.0.1"
      STATUS=$($CURL -o /dev/null -w "%{http_code}" ${DEPLOY_URL}/health)
      if [ "$STATUS" = "200" ]; then
        echo "OK: HTTP $STATUS"
      else
        echo "CHYBA: HTTP $STATUS"
        docker logs --tail 50 ${CONTAINER_NAME}
        exit 1
      fi
    - |
      echo "Overujem Keycloak config v config.js kontajnera..."
      docker exec ${CONTAINER_NAME} sh -c \
        "grep -q '${KEYCLOAK_URL}' /usr/share/nginx/html/config.js" \
        && echo "OK: ${KEYCLOAK_URL} / ${KEYCLOAK_REALM} / ${KEYCLOAK_CLIENT_ID}" \
        || { echo "CHYBA: nasadeny config.js nema spravny Keycloak config"; exit 1; }
    - |
      echo "Overujem dostupnost Keycloak realmu..."
      STATUS=$($CURL -o /dev/null -w "%{http_code}" \
        "${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}/.well-known/openid-configuration")
      if [ "$STATUS" = "200" ]; then
        echo "OK: realm ${KEYCLOAK_REALM} odpoveda"
      else
        echo "CHYBA: realm ${KEYCLOAK_REALM} vratil HTTP $STATUS"
        exit 1
      fi
  needs:
    - build-and-deploy

# Detects backend OpenAPI changes. The runner has Docker, not Node, so the Node
# steps run in the same image as the Dockerfile build stage. On failure run
# `npm run api:update` locally, fix the type errors and commit the snapshot.
api-drift:
  stage: api-check
  tags:
    - deploy-abco
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"'
      when: on_success
    - when: manual
      allow_failure: true
  variables:
    BACKEND_URL: "http://10.99.99.53:8000"
    NODE_IMAGE: "node:22.23.1-alpine"
  script:
    - |
      docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e BACKEND_URL \
        -v "${CI_PROJECT_DIR}:/app" -w /app ${NODE_IMAGE} \
        sh -c "npm ci && npm run api:update"
    - git diff --exit-code -- openapi/abco-api.json || { echo "Backend OpenAPI changed; run npm run api:update locally."; exit 1; }
    - |
      docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
        -v "${CI_PROJECT_DIR}:/app" -w /app ${NODE_IMAGE} \
        npx tsc -p tsconfig.app.json --noEmit
