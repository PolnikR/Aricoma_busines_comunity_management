<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provider Relationships Helper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ABCO tokens from src/index.css */
  :root {
    --page: #f7f9fc; --surface: #ffffff; --surface-subtle: #fbfdff; --surface-muted: #f1f6fb; --surface-hover: #e8f2fa;
    --text-primary: #17233d; --text-secondary: #3b4763; --text-muted: #71819a; --text-subtle: #93a0b5;
    --border: #dbe7f2; --border-strong: #c8d7e7; --accent: #0d91d7; --accent-soft: #e8f6fd; --focus: #1596dd;
    --success-50: #ecfdf3; --success-600: #039855; --warning-50: #fffaeb; --warning-600: #dc6803;
    --error-50: #fef3f2; --error-500: #f04438; --error-600: #d92d20; --backdrop: rgba(16, 24, 40, .3);
    --partner: #dc6803;
  }
  .dark {
    --page: #09111f; --surface: #111c2f; --surface-subtle: #152238; --surface-muted: #1a2941; --surface-hover: #22344f;
    --text-primary: #edf4ff; --text-secondary: #c5d1e2; --text-muted: #98a8bf; --text-subtle: #75869f;
    --border: #293b56; --border-strong: #3a506f; --accent: #43b2ec; --accent-soft: #123854; --focus: #5bc0f2;
    --success-50: rgba(18,183,106,.15); --success-600: #12b76a; --warning-50: rgba(247,144,9,.15); --warning-600: #fd853a;
    --error-50: rgba(240,68,56,.15); --error-500: #f97066; --error-600: #f97066; --backdrop: rgba(0,0,0,.55);
    --partner: #fd853a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Outfit, sans-serif; background: var(--page); color: var(--text-primary); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }

  /* Mockup chrome — not part of the design */
  .chrome { position: sticky; top: 0; z-index: 60; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; padding: 10px 16px; background: #17233d; color: #f8fafc; font-size: 13px; }
  .chrome strong { font-weight: 600; margin-right: 4px; }
  .seg { display: inline-flex; border: 1px solid #33425d; border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: transparent; padding: 5px 10px; cursor: pointer; color: #a8b4c6; }
  .seg button[aria-pressed="true"] { background: #33425d; color: #fff; }
  .page { padding: 24px 16px; max-width: 1200px; margin: 0 auto; }
  .page h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .page p { margin: 0 0 16px; color: var(--text-muted); font-size: 14px; }
  .open-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; color: var(--text-secondary); }
  .fake-table { margin-top: 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); height: 320px; }

  /* Modal shell = Modal.tsx (fixed header/footer, only body scrolls) */
  .backdrop { position: fixed; inset: 0; background: var(--backdrop); z-index: 40; }
  .modal { position: fixed; z-index: 50; left: 50%; top: calc(50% + 24px); transform: translate(-50%, -50%);
    width: calc(100% - 32px); max-width: 880px; max-height: calc(100vh - 96px);
    display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 12px 24px -8px rgba(16,24,40,.18); }
  .modal-head { display: flex; align-items: center; border-bottom: 1px solid var(--border); padding: 14px 20px; }
  .modal-head h2 { font-size: 16px; font-weight: 600; margin: 0; }
  .icon-btn { margin-left: auto; border: 0; background: transparent; border-radius: 8px; padding: 4px; cursor: pointer; color: var(--text-muted); display: grid; }
  .icon-btn:hover { background: var(--surface-hover); }
  .modal-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 20px 16px; }
  .modal-foot { display: flex; justify-content: flex-end; border-top: 1px solid var(--border); padding: 10px 20px; }
  .btn { border: 1px solid var(--border-strong); background: var(--surface); border-radius: 8px; padding: 6px 14px; font-size: 13px; font-weight: 500; cursor: pointer; }
  .btn:hover { background: var(--surface-hover); }

  /* 1 — text part */
  .intro { font-size: 13px; line-height: 1.5; color: var(--text-secondary); }
  .intro p { margin: 0 0 4px; }
  .intro .muted { color: var(--text-muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 20px; margin: 10px 0 14px; font-size: 12px; color: var(--text-muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend b { font-weight: 600; }
  .legend .bk { color: var(--accent); } .legend .pt { color: var(--partner); }

  /* 2 — rows */
  .group-title { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 6px; }
  .group-title.second { margin-top: 14px; }
  .rows { border: 1px solid var(--border); border-radius: 12px; }
  .row { display: grid; grid-template-columns: 200px 112px minmax(0, 1fr); align-items: start; padding: 8px 10px; }
  .row + .row { border-top: 1px solid var(--border); }
  .row.storage-only { grid-template-columns: minmax(0, 1fr); }
  .stack { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .target { display: grid; grid-template-columns: 200px 92px minmax(0, 200px); align-items: center; min-width: 0; }
  .target.alone { grid-template-columns: 200px; }

  .card { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 6px 10px; min-width: 0; }
  .card .name { display: block; font-size: 13px; font-weight: 600; line-height: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .meta { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-muted); line-height: 18px; }
  .card .id { display: block; font-size: 10.5px; color: var(--text-subtle); line-height: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card.unavailable { border-style: dashed; background: var(--surface-subtle); }
  .card.unavailable .name { font-family: ui-monospace, Consolas, monospace; font-weight: 500; font-size: 12px; color: var(--text-secondary); }
  .badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 0 7px; font-size: 10.5px; line-height: 16px; font-weight: 500; white-space: nowrap; }
  .b-source { background: var(--success-50); color: var(--success-600); }
  .b-target { background: var(--warning-50); color: var(--warning-600); }
  .b-light { background: var(--surface-muted); color: var(--text-muted); }

  /* connectors: label + line + arrow tips, color carries kind, text carries meaning */
  .conn { position: relative; display: flex; align-items: flex-end; justify-content: center; height: 62px; padding-bottom: 33px; color: var(--accent); }
  .conn::before { content: ""; position: absolute; left: 8px; right: 8px; top: 31px; border-top: 1.5px solid currentColor; }
  .conn.tr::after { content: ""; position: absolute; top: 31.75px; transform: translateY(-50%); border: 4px solid transparent; }
  .conn.tr::after { right: 4px; border-left: 6px solid currentColor; border-right: 0; }
  .conn .tl-tip { position: absolute; left: 4px; top: 31.75px; transform: translateY(-50%); border: 4px solid transparent; border-right: 6px solid currentColor; border-left: 0; }
  .conn .lbl { position: relative; padding: 0 4px; font-size: 10.5px; font-weight: 600; white-space: nowrap; display: inline-flex; gap: 4px; align-items: center; }
  .conn.partner { color: var(--partner); }
  .conn.mismatch::before { border-top-style: dashed; }
  .conn .flag { font-weight: 500; color: var(--text-muted); border: 1px solid var(--border-strong); border-radius: 999px; padding: 0 5px; line-height: 14px; font-size: 10px; }
  .none { font-size: 12px; color: var(--text-subtle); font-style: italic; align-self: center; padding-left: 4px; }
  .partner-ref { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12px; color: var(--text-secondary); padding-left: 2px; }
  .partner-ref .pt { color: var(--partner); font-weight: 600; font-size: 10.5px; white-space: nowrap; }
  .partner-ref .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .partner-ref .id { color: var(--text-subtle); font-size: 10.5px; white-space: nowrap; }

  @media (max-width: 760px) {
    .row, .target { grid-template-columns: minmax(0, 1fr); }
    .target, .target.alone { grid-template-columns: minmax(0, 1fr) !important; }
    .modal { top: 50%; max-height: calc(100vh - 32px); }
    .none { grid-column: auto !important; padding: 4px 0 0; }
    .conn { height: 28px; padding: 0 0 0 20px; align-items: center; }
    .conn .lbl { padding-left: 4px; }
    .conn { height: 24px; justify-content: flex-start; padding-left: 20px; }
    .conn::before { left: 12px; right: auto; top: 0; bottom: 0; border-top: 0; border-left: 1.5px solid currentColor; }
    .conn.mismatch::before { border-left-style: dashed; }
    .conn.tr::after, .conn .tl-tip { display: none; }
    .partner-ref { padding: 4px 0 0; flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="chrome" role="toolbar" aria-label="Mockup controls">
  <span><strong>Data</strong><span class="seg" id="seg-data"><button data-d="current" aria-pressed="true">Current payload</button><button data-d="edge" aria-pressed="false">Edge cases</button></span></span>
  <span><strong>Theme</strong><span class="seg" id="seg-theme"><button data-t="light" aria-pressed="true">Light</button><button data-t="dark" aria-pressed="false">Dark</button></span></span>
  <span style="color:#a8b4c6">Approved template v2 · relationships joined by provider id at runtime</span>
</div>

<main class="page">
  <h1>Infrastructure providers</h1>
  <p>Systems ABCO discovers resources from.</p>
  <button class="open-btn" id="open">Provider relationships</button>
  <div class="fake-table" aria-hidden="true"></div>
</main>
<div id="modal-root"></div>

<script>
const DATA = {
  current: [
    { id: 'vmware-vcenter-01', name: 'Production vCenter Source', type: 'VMWARE', role: 'source', backingStorageProviderIds: ['ibm-flashsystem-01'] },
    { id: 'vmware-vcenter-02', name: 'DR vCenter Target', type: 'VMWARE', role: 'target', backingStorageProviderIds: [] },
    { id: 'vmware-vcenter-03', name: 'Branch vCenter Source', type: 'VMWARE', role: 'source', backingStorageProviderIds: ['ibm-flashsystem-01'] },
    { id: 'ibm-power-01', name: 'IBM Power Source', type: 'IBM_POWER', role: 'source', backingStorageProviderIds: ['ibm-flashsystem-02'] },
    { id: 'ibm-flashsystem-01', name: 'IBM Flash Source 01', type: 'FLASHCOPY', role: 'source', partnerProviderId: 'ibm-flashsystem-02' },
    { id: 'ibm-flashsystem-02', name: 'IBM Flash Target 02', type: 'FLASHCOPY', role: 'target', partnerProviderId: 'ibm-flashsystem-01' },
  ],
  edge: [
    { id: 'vmware-vcenter-01', name: 'Production vCenter Source', type: 'VMWARE', role: 'source', backingStorageProviderIds: ['ibm-flashsystem-01', 'hitachi-vsp-01'] },
    { id: 'vmware-vcenter-02', name: 'DR vCenter Target', type: 'VMWARE', role: 'target', backingStorageProviderIds: [] },
    { id: 'vmware-vcenter-03', name: 'Branch vCenter Source', type: 'VMWARE', role: 'source', backingStorageProviderIds: ['ibm-flashsystem-01', 'vmware-vcenter-02'] },
    { id: 'ibm-power-01', name: 'IBM Power Source', type: 'IBM_POWER', role: 'source', backingStorageProviderIds: ['ibm-flashsystem-02', 'ibm-flashsystem-09'] },
    { id: 'ibm-flashsystem-01', name: 'IBM Flash Source 01', type: 'FLASHCOPY', role: 'source', partnerProviderId: 'ibm-flashsystem-02' },
    { id: 'ibm-flashsystem-02', name: 'IBM Flash Target 02', type: 'FLASHCOPY', role: 'target', partnerProviderId: 'ibm-flashsystem-01' },
    { id: 'ibm-flashsystem-03', name: 'IBM Flash Lab 03', type: 'FLASHCOPY', role: 'source', partnerProviderId: 'ibm-flashsystem-04' },
    { id: 'ibm-flashsystem-04', name: 'IBM Flash Lab 04', type: 'FLASHCOPY', role: 'target', partnerProviderId: null },
    { id: 'hitachi-vsp-01', name: 'Hitachi VSP 01', type: 'HITACHI', role: 'source' },
    { id: 'hitachi-vsp-02', name: 'Hitachi VSP 02 (legacy)', type: 'HITACHI', role: 'target', partnerProviderId: 'hitachi-vsp-01' },
  ],
}

// Classifier + resolver — same rules as the planned FE modules
const COMPUTE = ['VMWARE', 'IBM_POWER'], STORAGE = ['FLASHCOPY', 'HITACHI'], PARTNER = ['FLASHCOPY']
const TYPE_LABEL = { VMWARE: 'VMware', IBM_POWER: 'IBM Power', FLASHCOPY: 'IBM FlashSystem', HITACHI: 'Hitachi' }
function resolveTopology(providers) {
  const byId = new Map(providers.map(p => [p.id, p]))
  const backing = []
  for (const p of providers) for (const toId of p.backingStorageProviderIds ?? []) {
    const target = byId.get(toId)
    backing.push({ fromId: p.id, toId, target, status: !target ? 'unresolved' : (!COMPUTE.includes(p.type) || !STORAGE.includes(target.type)) ? 'mismatch' : 'resolved' })
  }
  const partner = [], seen = new Map()
  for (const p of providers) {
    const toId = p.partnerProviderId; if (!toId) continue
    const key = [p.id, toId].sort().join('|')
    if (seen.has(key)) { seen.get(key).mutual = true; continue }
    const target = byId.get(toId)
    const status = !target ? 'unresolved' : (toId === p.id || !PARTNER.includes(p.type) || !PARTNER.includes(target.type)) ? 'mismatch' : 'resolved'
    const e = { fromId: p.id, toId, target, status, mutual: false }; seen.set(key, e); partner.push(e)
  }
  return { byId, compute: providers.filter(p => COMPUTE.includes(p.type)), storage: providers.filter(p => STORAGE.includes(p.type)), backing, partner }
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const role = r => `<span class="badge ${r === 'target' ? 'b-target' : 'b-source'}">${r === 'target' ? 'Target' : 'Source'}</span>`
const card = p => `<div class="card"><span class="name" title="${esc(p.name)}">${esc(p.name)}</span><span class="meta">${TYPE_LABEL[p.type] ?? p.type}${role(p.role)}</span><span class="id mono">${esc(p.id)}</span></div>`
const unavailable = id => `<div class="card unavailable"><span class="name" title="${esc(id)}">${esc(id)}</span><span class="meta"><span class="badge b-light">Unavailable</span></span><span class="id">Not in the current provider list</span></div>`
// dir: 'r' → arrow right, 'l' ← left, 'both' ↔
function conn(kind, label, dir, mismatch) {
  const tips = dir === 'r' || dir === 'both' ? ' tr' : ''
  return `<div class="conn ${kind}${tips}${mismatch ? ' mismatch' : ''}">${dir === 'l' || dir === 'both' ? '<i class="tl-tip"></i>' : ''}<span class="lbl">${label}${mismatch ? '<span class="flag">Mismatch</span>' : ''}</span></div>`
}

function renderRows(topo) {
  const shownPartner = new Set() // partner edge rendered as full card once, compact reference after that
  const partnerOf = id => topo.partner.find(e => e.fromId === id || e.toId === id)

  function partnerPart(storageId) {
    const e = partnerOf(storageId); if (!e) return null
    const otherId = e.fromId === storageId ? e.toId : e.fromId
    const other = topo.byId.get(otherId)
    const dir = e.mutual ? 'both' : (e.fromId === storageId ? 'r' : 'l')
    const key = e.fromId + '|' + e.toId
    if (shownPartner.has(key)) {
      const arrow = dir === 'both' ? '↔' : dir === 'r' ? '→' : '←'
      return `<div class="partner-ref"><span class="pt">${arrow} Partner</span><span class="nm">${esc(other ? other.name : otherId)}</span><span class="id mono">${esc(otherId)}</span>${e.status === 'mismatch' ? '<span class="flag" style="border:1px solid var(--border-strong);border-radius:999px;padding:0 5px;font-size:10px;color:var(--text-muted)">Mismatch</span>' : ''}</div>`
    }
    shownPartner.add(key)
    return conn('partner', 'Partner', dir, e.status === 'mismatch') + (other ? card(other) : unavailable(otherId))
  }
  function target(b) {
    const node = b.target ? card(b.target) : unavailable(b.toId)
    const p = b.target && STORAGE.includes(b.target.type) ? partnerPart(b.toId) : null
    if (!p) return `<div class="target alone">${node}</div>`
    if (p.startsWith('<div class="partner-ref"')) return `<div class="target" style="grid-template-columns:200px minmax(0,1fr)">${node}${p}</div>`
    return `<div class="target">${node}${p}</div>`
  }

  const computeRows = topo.compute.map(c => {
    const bs = topo.backing.filter(b => b.fromId === c.id)
    if (!bs.length) return `<div class="row">${card(c)}<div class="none" style="grid-column:span 2">No backing storage provider</div></div>`
    return `<div class="row">${card(c)}${conn('', 'Backing storage', 'r', false)}<div class="stack">${bs.map(b => b.status === 'mismatch'
      ? `<div class="target alone" style="grid-template-columns:200px auto">${card(b.target)}<span class="none" style="font-style:normal;color:var(--text-muted)"><span class="flag" style="border:1px solid var(--border-strong);border-radius:999px;padding:0 6px;font-size:10px;margin-right:6px">Mismatch</span>${TYPE_LABEL[b.target.type]} is not a storage provider</span></div>`
      : target(b)).join('')}</div></div>`
  })

  // Other storage relationships: shown so partner data is never hidden
  const used = new Set(topo.backing.filter(b => b.target).map(b => b.toId))
  const coveredByPartner = id => { const e = partnerOf(id); return e && (used.has(e.fromId) || used.has(e.toId)) }
  const otherRows = []
  for (const s of topo.storage) {
    if (used.has(s.id) || coveredByPartner(s.id)) continue
    const p = partnerPart(s.id)
    if (p === null) { otherRows.push(`<div class="row storage-only"><div class="target" style="grid-template-columns:200px auto">${card(s)}<span class="none">No relationships</span></div></div>`); continue }
    if (p.startsWith('<div class="partner-ref"')) continue // already shown as the other side of a pair
    otherRows.push(`<div class="row storage-only"><div class="target">${card(s)}${p}</div></div>`)
  }
  return `<h3 class="group-title">Compute providers</h3><div class="rows">${computeRows.join('')}</div>` +
    (otherRows.length ? `<h3 class="group-title second">Other storage relationships</h3><div class="rows">${otherRows.join('')}</div>` : '')
}

const state = { d: 'current', open: true }
function render() {
  const root = document.getElementById('modal-root')
  if (!state.open) { root.innerHTML = ''; return }
  const topo = resolveTopology(DATA[state.d])
  root.innerHTML = `<div class="backdrop" data-close></div>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="modal-head"><h2 id="mt">Provider relationships</h2>
      <button class="icon-btn" aria-label="Close" data-close><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="modal-body">
      <div class="intro">
        <p>Compute providers run workloads such as virtual machines or LPARs. They can use one or more storage providers as backing storage.</p>
        <p>IBM FlashSystem providers can additionally reference another FlashSystem as their replication partner.</p>
        <p class="muted">Relationships shown below are built from the current provider configuration.</p>
      </div>
      <div class="legend" aria-label="Legend">
        <span>Compute <b class="bk">→ Backing storage →</b> Storage</span>
        <span>Storage <b class="pt">↔ Partner ↔</b> Storage</span>
      </div>
      ${renderRows(topo)}
    </div>
    <div class="modal-foot"><button class="btn" data-close>Close</button></div>
  </div>`
  root.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => { state.open = false; render(); document.getElementById('open').focus() }))
  root.querySelector('.icon-btn').focus()
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.open) { state.open = false; render() } })
document.getElementById('open').addEventListener('click', () => { state.open = true; render() })
function seg(id, key, apply) {
  const el = document.getElementById(id)
  el.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return
    el.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); apply(b.dataset[key]) })
}
seg('seg-data', 'd', d => { state.d = d; state.open = true; render() })
seg('seg-theme', 't', t => { document.documentElement.classList.toggle('dark', t === 'dark'); render() })
const hash = new URLSearchParams(location.hash.slice(1))
for (const [id, key] of [['seg-data', 'd'], ['seg-theme', 't']]) { const v = hash.get(key); if (v) document.querySelector(`#${id} [data-${key}="${v}"]`)?.click() }
render()
</script>
</body>
</html>
