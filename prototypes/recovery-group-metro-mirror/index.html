<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recovery Group detail — Metro Mirror proposals</title>
<!-- Production stylesheet served by the Vite dev server: open via http://localhost:5173/prototypes/recovery-group-metro-mirror/ -->
<script type="module">import "/src/index.css"</script>
</head>
<body class="min-h-dvh">

<!-- Prototype controls (not part of the design) -->
<div class="relative z-60 flex flex-wrap items-center gap-x-4 gap-y-2 border-b border-border bg-surface px-4 py-2.5 text-xs text-text-secondary">
  <strong class="text-accent">TEMPLATE · Metro Mirror v Recovery Group detaile</strong>
  <label class="flex items-center gap-2">Návrh
    <select id="variant" class="h-8 rounded-md border border-border-strong bg-surface-subtle px-2">
      <option value="d" selected>D · Refined chain (D2, vybraný smer)</option>
      <option value="a">A · Metro Mirror v sekcii Inventory</option>
      <option value="b">B · Samostatná sekcia Metro Mirror</option>
      <option value="c">C · Replikačný reťazec master → aux → FlashCopy</option>
    </select>
  </label>
  <label class="flex items-center gap-2">Scenár
    <select id="scenario" class="h-8 rounded-md border border-border-strong bg-surface-subtle px-2">
      <option value="copying">Copying (rdb_and_app, 64 %)</option>
      <option value="synced">Synchronized (progress = null)</option>
      <option value="mixed">Neznámy stav + null progress</option>
      <option value="many">Mnoho mappingov (12)</option>
      <option value="error">Metro Mirror error (best-effort)</option>
      <option value="empty">Bez CG a mappingov</option>
      <option value="missing">Auxiliary nie je v inventory / not found</option>
      <option value="none">metro_mirror = null</option>
    </select>
  </label>
  <label class="flex items-center gap-2">Dialóg
    <select id="size" class="h-8 rounded-md border border-border-strong bg-surface-subtle px-2">
      <option value="lg">lg · 60rem (dnes)</option>
      <option value="xl">xl · 75rem</option>
    </select>
  </label>
  <label class="flex items-center gap-2"><input id="compact" type="checkbox"> Compact view</label>
  <label class="flex items-center gap-2"><input id="dark" type="checkbox"> Dark</label>
</div>

<!-- Backdrop page -->
<div class="p-8 text-text-subtle">
  <p class="text-xl font-semibold text-text-primary">Recovery groups</p>
  <p class="text-sm">Manage reusable groups of resources that can be assigned to recovery application tiers.</p>
</div>
<div class="fixed inset-0 top-12.25 z-40 bg-black/30" id="backdrop" aria-hidden="true"></div>
<div id="dialog" role="dialog" aria-modal="true" aria-label="Recovery group detail" class="fixed z-50 flex flex-col overflow-hidden bg-surface"></div>

<script>
// ---------------------------------------------------------------------------
// Mock data
// ---------------------------------------------------------------------------
const AUX = 'auxb099da7e_'
const PAIRS = [['V5000_VOLUME01', 72], ['RDM_DISK01', 64], ['RDM_DISK02', 91], ['V5000_VOLUME02', 80]]
const baseMM = {
  mode: 'managed',
  queried_provider_id: 'ibm-flashsystem-02',
  consistency_group: { id: '55', name: 'rdb_and_app', state: 'inconsistent_copying', primary: 'master', freeze_time: null, relationship_count: 4, progress: 64 },
  mappings: PAIRS.map(([name, progress]) => ({ master_volume: name, auxiliary_volume: AUX + name, state: 'inconsistent_copying', progress, primary: 'master' })),
  error: null,
}
const SCENARIOS = {
  copying: baseMM,
  synced: { ...baseMM, mode: 'existing',
    consistency_group: { ...baseMM.consistency_group, state: 'consistent_synchronized', progress: null },
    mappings: baseMM.mappings.map(m => ({ ...m, state: 'consistent_synchronized', progress: null })) },
  mixed: { ...baseMM,
    consistency_group: { ...baseMM.consistency_group, state: 'idling_disconnected', progress: null, freeze_time: '2026/10/06 09:41:12' },
    mappings: [
      { ...baseMM.mappings[0], state: 'consistent_synchronized', progress: null },
      { ...baseMM.mappings[1], state: 'inconsistent_copying', progress: 0 },
      { ...baseMM.mappings[2], state: 'consistent_stopped', progress: null },
      { ...baseMM.mappings[3], state: 'some_future_state', progress: null, primary: 'aux' },
    ] },
  many: { ...baseMM,
    consistency_group: { ...baseMM.consistency_group, relationship_count: 12 },
    mappings: Array.from({ length: 12 }, (_, i) => { const n = `ORACLE_PROD_DATAFILE_VOLUME_${String(i + 1).padStart(2, '0')}`; return { master_volume: n, auxiliary_volume: AUX + n, state: 'inconsistent_copying', progress: 40 + i * 5, primary: 'master' } }) },
  error: { mode: 'managed', queried_provider_id: 'ibm-flashsystem-02', consistency_group: null, mappings: [], error: 'Provider ibm-flashsystem-02 did not respond within 10 s (lsrcconsistgrp).' },
  empty: { mode: 'existing', queried_provider_id: 'ibm-flashsystem-02', consistency_group: null, mappings: [], error: null },
  missing: { ...baseMM,
    mappings: [...baseMM.mappings.slice(0, 3), { ...baseMM.mappings[3], master_volume: 'V5000_VOLUME03', auxiliary_volume: AUX + 'V5000_VOLUME03', progress: 12 }] },
  none: null,
}
const INVENTORY = {
  recovery_group_id: 'rdb_and_app', recovery_group_name: 'rdb_and_app', run_id: '261005153937_b099da7e', provider_id_volume: 'ibm-flashsystem-01',
  volumes: Object.fromEntries(PAIRS.map(([name]) => [AUX + name, {
    found: true,
    relations: [1, 2].map(n => ({ role: 'source', paired_volume: { name: `snap${n}_${AUX}${name}` } })),
  }])),
}

// D2 inventory per scenario: RDM_DISK01 keeps hourly snapshots (inner scroll), mixed has a
// volume without snapshots, many mirrors the 12 mappings, missing has a volume not found.
function inventoryFor(scenario) {
  const snaps = (name, count) => Array.from({ length: count }, (_, i) => ({ role: 'source', paired_volume: { name: `snap${String(i + 1).padStart(2, '0')}_${name}` } }))
  const vol = (name, count, found = true) => [name, { found, relations: found ? snaps(name, count) : [] }]
  let volumes
  if (scenario === 'many') volumes = SCENARIOS.many.mappings.map(m => vol(m.auxiliary_volume, 2))
  else volumes = [vol(AUX + 'V5000_VOLUME01', 2), vol(AUX + 'RDM_DISK01', 14), vol(AUX + 'RDM_DISK02', 2, scenario !== 'missing'), vol(AUX + 'V5000_VOLUME02', scenario === 'mixed' ? 0 : 2)]
  return { ...INVENTORY, volumes: Object.fromEntries(volumes) }
}

// ---------------------------------------------------------------------------
// Icons (copied from src/shared/icons/Icons.tsx)
// ---------------------------------------------------------------------------
const svg = (body, cls = 'size-4') => `<svg class="${cls} shrink-0" viewBox="0 0 20 20" fill="none" aria-hidden="true">${body}</svg>`
const S = 'stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"'
const ICON = {
  grid: `<path d="M4.167 4.167h4.166v4.166H4.167V4.167ZM11.667 4.167h4.166v4.166h-4.166V4.167ZM4.167 11.667h4.166v4.166H4.167v-4.166ZM11.667 11.667h4.166v4.166h-4.166v-4.166Z" ${S}/>`,
  execution: `<circle cx="10" cy="10" r="7.25" ${S}/><path d="m8.25 6.75 5 3.25-5 3.25v-6.5Z" ${S}/>`,
  server: `<path d="M4.167 4.167h11.666v4.166H4.167V4.167ZM4.167 11.667h11.666v4.166H4.167v-4.166Z" ${S}/><path d="M6.667 6.25h.008M6.667 13.75h.008" ${S}/>`,
  refresh: `<path d="M17.5 8.333A6.667 6.667 0 0 0 5.417 4.167M2.5 11.667a6.667 6.667 0 0 0 12.083 4.166" ${S}/><path d="M17.5 6.667v1.666h-1.667M2.5 13.333v-1.666h1.667" ${S}/>`,
  api: `<path d="m7.25 5-4 5 4 5M12.75 5l4 5-4 5M11.5 3.75l-3 12.5" ${S}/>`,
  close: `<path d="m5 5 10 10M15 5 5 15" ${S}/>`,
  panel: `<rect x="3.333" y="4.167" width="13.333" height="11.667" rx="1.667" ${S}/><path d="M12.5 4.167v11.666" ${S}/>`,
  max: `<path d="M12.5 3.333h4.167V7.5M7.5 16.667H3.333V12.5M16.667 3.333 11.667 8.333M3.333 16.667l5-5" ${S}/>`,
  help: `<circle cx="10" cy="10" r="7.25" ${S}/><path d="M8.1 7.9a2 2 0 1 1 2.7 1.9c-.5.2-.8.6-.8 1.1v.4M10 13.6h.008" ${S}/>`,
  alert: `<path d="M8.575 3.25 1.517 15a1.667 1.667 0 0 0 1.425 2.5h14.116a1.667 1.667 0 0 0 1.425-2.5L11.425 3.25a1.667 1.667 0 0 0-2.85 0Z" ${S}/><path d="M10 7.5v3.333M10 14.167h.008" ${S}/>`,
  check: `<path d="m4.167 10.417 3.333 3.333 8.333-8.333" ${S}/>`,
  copy: `<path d="M7.5 7.5h8.333a.833.833 0 0 1 .834.833v8.334a.833.833 0 0 1-.834.833H7.5a.833.833 0 0 1-.833-.833V8.333A.833.833 0 0 1 7.5 7.5Z" ${S}/><path d="M13.333 7.5V4.167a.833.833 0 0 0-.833-.834H4.167a.833.833 0 0 0-.834.834V12.5c0 .46.373.833.834.833H6.667" ${S}/>`,
  chevron: `<path d="m5 7.5 5 5 5-5" ${S}/>`,
  disk: `<path d="M5.417 4.167h9.166l2.917 7.5v3.333a.833.833 0 0 1-.833.833H3.333a.833.833 0 0 1-.833-.833v-3.333l2.917-7.5Z" ${S}/><path d="M2.5 11.667h15" ${S}/><path d="M14.167 13.75h.008" ${S}/>`,
}

// ---------------------------------------------------------------------------
// Pure helpers (would become small functions in production)
// ---------------------------------------------------------------------------
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const humanize = s => { const t = String(s).replace(/_/g, ' '); return t.charAt(0).toUpperCase() + t.slice(1) }
// Keyword-based tone, so states the UI has never seen still get a sensible, neutral look.
function stateTone(state) {
  const s = String(state ?? '').toLowerCase()
  if (!s) return 'neutral'
  if (/(error|fail|disconnect|offline)/.test(s)) return 'error'
  if (/(stopp|idling|paused|freez)/.test(s)) return 'warning'
  if (/(copying|sync(h)?ronizing|prepar)/.test(s)) return 'info'
  if (/(synchronized|consistent)/.test(s)) return 'success'
  return 'neutral'
}
// Same tone colours as Badge (light) and DetailStatusBlock.
const TONE = {
  success: 'bg-success-50 text-success-600 dark:bg-success-500/15 dark:text-success-500',
  error: 'bg-error-50 text-error-600 dark:bg-error-500/15 dark:text-error-500',
  warning: 'bg-warning-50 text-warning-600 dark:bg-warning-500/15 dark:text-orange-400',
  info: 'bg-blue-light-50 text-blue-light-500 dark:bg-blue-light-500/15 dark:text-blue-light-500',
  neutral: 'bg-surface-muted text-text-secondary',
}
const badge = (tone, text, title) => `<span class="inline-flex shrink-0 items-center justify-center gap-1 rounded-full px-2.5 py-0.5 text-theme-xs font-medium ${TONE[tone]}"${title ? ` title="${esc(title)}"` : ''}>${esc(text)}</span>`
const stateBadge = state => state ? badge(stateTone(state), humanize(state), state) : badge('neutral', 'Unknown state')
const tonePill = (tone, text) => `<span class="inline-flex items-center gap-1.5 rounded-md px-2.5 py-1 text-sm font-semibold ${TONE[tone]}">${tone === 'success' ? svg(ICON.check) : tone === 'warning' || tone === 'error' ? svg(ICON.alert) : '<span aria-hidden="true" class="size-1.5 rounded-full bg-current"></span>'}${esc(text)}</span>`

// Progress: a number gets a bar; null never renders as 0 %.
function progress(value, state, label) {
  if (typeof value === 'number') {
    const done = value >= 100
    return `<div class="flex min-w-0 items-center gap-2">
      <div class="h-1.5 min-w-0 flex-1 overflow-hidden rounded-full bg-surface-muted" role="progressbar" aria-label="${esc(label)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${value}">
        <div class="h-full rounded-full ${done ? 'bg-success-500' : 'bg-accent'}" style="width:${Math.max(0, Math.min(100, value))}%"></div>
      </div>
      <span class="w-10 shrink-0 text-right text-xs font-semibold tabular-nums text-text-secondary">${value} %</span>
    </div>`
  }
  return stateTone(state) === 'success'
    ? `<span class="text-xs text-success-600 dark:text-success-500">✓ In sync</span>`
    : `<span class="text-xs text-text-subtle">Not reported</span>`
}

const field = (label, value) => `<div class="min-w-0"><dt class="text-xs leading-4 text-text-muted">${esc(label)}</dt><dd class="mt-1 min-w-0 text-sm leading-5 text-text-primary wrap-anywhere">${value}</dd></div>`
const groupHeader = (title, description) => `<header class="mb-3.5"><h4 class="text-[13px] font-semibold leading-5 text-text-primary">${title}</h4>${description ? `<p class="text-xs text-text-muted">${description}</p>` : ''}</header>`
// A visual seam between the two storage layers, same hairline as consecutive DetailFieldGroups.
const layer = (inner, first = false) => `<section class="${first ? '' : 'border-t border-border/70 pt-7'}">${inner}</section>`

// ---------------------------------------------------------------------------
// Metro Mirror building blocks
// ---------------------------------------------------------------------------
const reference = (id, mode) => `<div class="flex flex-wrap items-center gap-x-4 gap-y-1 border-t border-border/70 px-5 py-3">
  <span class="w-full text-xs text-text-muted @min-[560px]/detail-content:w-auto">Queried provider</span>
  <span class="min-w-0 flex-1 font-mono text-[12.5px] text-text-secondary wrap-anywhere">${esc(id)}</span>
  <button type="button" class="flex size-7 items-center justify-center rounded-md text-text-subtle hover:bg-surface-hover hover:text-text-primary" aria-label="Copy queried provider">${svg(ICON.copy, 'size-3.5')}</button>
  ${mode ? `<span class="border-l border-border pl-4 text-xs text-text-muted">Mode <span class="font-medium text-text-secondary">${esc(humanize(mode))}</span></span>` : ''}
</div>`

// DetailStatusBlock: the replication state of the consistency group.
function mmStatusBlock(mm) {
  const title = '<h4 class="text-xs font-normal text-text-muted">Metro Mirror replication</h4>'
  if (mm.error) {
    return `<section class="rounded-xl border border-border" data-tone="warning">
      <div class="px-5 py-4">${title}
        <div class="mt-2 flex flex-wrap items-center gap-x-3 gap-y-2">${tonePill('warning', 'Status unavailable')}</div>
        <p class="mt-3 text-sm text-text-secondary">${esc(mm.error)}</p>
        <p class="mt-1 text-xs text-text-muted">Metro Mirror status is collected best-effort. Volume inventory and FlashCopy mappings are not affected.</p>
      </div>
      ${mm.queried_provider_id ? reference(mm.queried_provider_id, mm.mode) : ''}
    </section>`
  }
  const cg = mm.consistency_group
  if (!cg) return ''
  const mappings = mm.mappings ?? []
  const total = cg.relationship_count ?? mappings.length
  return `<section class="rounded-xl border border-border" data-tone="${stateTone(cg.state)}">
    <div class="px-5 py-4">${title}
      <div class="mt-2 flex flex-wrap items-center gap-x-3 gap-y-2">
        ${tonePill(stateTone(cg.state), cg.state ? humanize(cg.state) : 'Unknown state')}
        <span class="text-sm text-text-secondary">Consistency group <strong class="font-semibold text-text-primary">${esc(cg.name ?? cg.id)}</strong> <span class="font-mono text-xs text-text-subtle">#${esc(cg.id)}</span></span>
      </div>
    </div>
    <dl class="grid grid-cols-2 gap-x-10 gap-y-4 border-t border-border/70 px-5 py-4 @min-[600px]/detail-content:grid-cols-3">
      ${field('Progress', progress(cg.progress, cg.state, 'Consistency group progress'))}
      ${field('Primary', esc(humanize(cg.primary ?? '—')))}
      ${field('Relationships', mappings.length === total ? String(total) : `${mappings.length} of ${total} returned`)}
      ${cg.freeze_time ? field('Frozen at', `<span class="font-mono text-[12.5px] text-text-secondary">${esc(cg.freeze_time)}</span>`) : ''}
    </dl>
    ${mm.queried_provider_id ? reference(mm.queried_provider_id, mm.mode) : ''}
  </section>`
}

const PAGE = 5
let mmPage = 1

// Mapping rows: one line per mapping from 560 px of content width, stacked below it.
function mmMappings(mm, inventoryNames) {
  const mappings = mm.mappings ?? []
  if (mm.error) return ''
  if (!mm.consistency_group && mappings.length === 0) {
    return `<p class="rounded-lg border border-dashed border-border px-4 py-3 text-sm text-text-muted">No consistency group or mappings were reported for this run.</p>`
  }
  const cgPrimary = mm.consistency_group?.primary
  const pages = Math.max(1, Math.ceil(mappings.length / PAGE))
  mmPage = Math.min(mmPage, pages)
  const visible = mappings.slice((mmPage - 1) * PAGE, mmPage * PAGE)
  const cols = '@min-[560px]/detail-content:grid-cols-[minmax(0,1fr)_1.25rem_minmax(0,1.2fr)_12rem]'
  const rows = visible.map(m => {
    const master = m.master_volume ?? '—'
    const aux = m.auxiliary_volume ?? '—'
    const linked = inventoryNames.has(aux)
    // Primary per mapping only when it differs from the consistency group.
    const primaryNote = m.primary && m.primary !== cgPrimary
      ? `<span class="text-[11px] font-medium text-warning-600 dark:text-orange-400">Primary: ${esc(humanize(m.primary))}</span>` : ''
    return `<li class="grid grid-cols-[4.5rem_minmax(0,1fr)] gap-x-3 gap-y-1 px-4 py-3 ${cols} @min-[560px]/detail-content:items-center">
      <span class="self-center text-[11px] text-text-muted @min-[560px]/detail-content:hidden">Master</span>
      <span class="min-w-0 truncate text-sm font-medium text-text-primary" title="${esc(master)}">${esc(master)}</span>
      <span class="hidden text-center text-accent @min-[560px]/detail-content:block" aria-label="replicates to">→</span>
      <span class="self-center text-[11px] text-text-muted @min-[560px]/detail-content:hidden"><span class="text-accent" aria-hidden="true">→</span> Auxiliary</span>
      <span class="min-w-0 truncate text-sm text-text-primary" title="${esc(aux)}">${linked
        ? `<button type="button" data-goto="${esc(aux)}" title="Show ${esc(aux)} in volume inventory" class="max-w-full truncate rounded text-left hover:text-accent hover:underline focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-focus/15">${esc(aux)}</button>`
        : esc(aux)}</span>
      <div class="col-span-2 mt-1 flex min-w-0 flex-col gap-1 @min-[560px]/detail-content:col-span-1 @min-[560px]/detail-content:mt-0">
        <div class="flex items-center justify-between gap-2">${stateBadge(m.state)}${primaryNote}</div>
        ${progress(m.progress, m.state, `Replication progress ${master}`)}
      </div>
    </li>`
  }).join('')
  const total = mm.consistency_group?.relationship_count ?? mappings.length
  return `<div>
    <div class="mb-2 flex items-baseline justify-between gap-3">
      <h4 class="text-[13px] font-semibold leading-5 text-text-primary">Volume mappings</h4>
      <span class="text-xs text-text-muted">${mappings.length === total ? `${total} relationships` : `${mappings.length} of ${total} relationships returned`}</span>
    </div>
    <div class="overflow-hidden rounded-lg border border-border">
      <div class="hidden gap-x-3 border-b border-border bg-surface-muted/70 px-4 py-2 text-[11px] font-medium text-text-muted dark:bg-surface-muted/50 @min-[560px]/detail-content:grid ${cols}">
        <span>Master volume</span><span></span><span>Auxiliary volume</span><span>State · progress</span>
      </div>
      ${mappings.length ? `<ul class="divide-y divide-border/70" aria-label="Metro Mirror mappings">${rows}</ul>` : '<p class="px-4 py-3 text-sm text-text-muted">No mappings were returned.</p>'}
    </div>
    ${pages > 1 ? `<nav class="mt-3 flex items-center justify-between gap-3 text-xs text-text-muted" aria-label="Metro Mirror mappings pages">
      <span>Page ${mmPage} of ${pages}</span>
      <span class="flex gap-1">${Array.from({ length: pages }, (_, i) => `<button type="button" data-page="${i + 1}" aria-label="Page ${i + 1}" ${i + 1 === mmPage ? 'aria-current="page"' : ''} class="grid size-8 place-items-center rounded-lg text-sm ${i + 1 === mmPage ? 'bg-accent text-white' : 'border border-border bg-surface text-text-secondary hover:bg-surface-hover'}">${i + 1}</button>`).join('')}</span>
    </nav>` : ''}
  </div>`
}

// ---------------------------------------------------------------------------
// Existing inventory (1:1 with RecoveryGroupInventory.tsx)
// ---------------------------------------------------------------------------
function inventorySummary(inv) {
  const vols = Object.entries(inv.volumes)
  const found = vols.filter(([, v]) => v.found).length
  const rel = vols.reduce((t, [, v]) => t + v.relations.length, 0)
  return `<div class="rounded-xl border border-border bg-surface-subtle p-3.5">
    <div class="flex items-start justify-between gap-3">
      <div class="min-w-0"><p class="truncate text-sm font-semibold text-text-primary">${esc(inv.recovery_group_name)}</p><p class="mt-1 truncate font-mono text-[11px] text-text-subtle">${esc(inv.recovery_group_id)} · ${esc(inv.run_id)}</p></div>
      ${badge(found === vols.length ? 'success' : 'warning', `${found}/${vols.length} found`)}
    </div>
    <div class="mt-3 grid grid-cols-3 gap-2">
      ${[['Volumes', vols.length], ['Found', found], ['Relations', rel]].map(([l, v]) => `<div class="rounded-lg border border-border bg-surface px-2.5 py-2"><strong class="block text-base text-text-primary">${v}</strong><span class="text-[10px] font-medium uppercase tracking-wide text-text-subtle">${l}</span></div>`).join('')}
    </div>
  </div>`
}

function volumeDetails(inv, openName) {
  return `<div class="space-y-4">${Object.entries(inv.volumes).map(([name, v]) => `
    <details id="vol-${esc(name)}" class="group overflow-hidden rounded-lg border border-border bg-surface"${name === openName ? ' open' : ''}>
      <summary class="grid cursor-pointer list-none grid-cols-[minmax(0,1fr)_auto_auto] items-center gap-2 px-3 py-3">
        <div class="min-w-0"><span class="block truncate text-sm font-semibold text-text-primary" title="${esc(name)}">${esc(name)}</span><span class="text-[11px] text-text-subtle">${v.relations.length} mapping relations</span></div>
        ${badge(v.found ? 'success' : 'error', v.found ? 'Found' : 'Not found')}
        <span class="text-text-muted transition-transform group-open:rotate-180">${svg(ICON.chevron)}</span>
      </summary>
      <div class="space-y-3 border-t border-border bg-surface-subtle px-3 py-3">
        ${v.relations.map(r => {
          const paired = r.paired_volume.name
          const src = r.role === 'source' ? name : paired, tgt = r.role === 'target' ? name : paired
          return `<div class="grid grid-cols-[minmax(0,1fr)_1.5rem_minmax(0,1fr)] items-center gap-1.5">
            <div class="min-w-0 rounded-md border border-border bg-surface px-2.5 py-2"><span class="block text-[9px] font-semibold uppercase tracking-wide text-text-subtle">Source volume</span><span class="mt-0.5 block truncate text-xs font-semibold text-text-primary" title="${esc(src)}">${esc(src)}</span></div>
            <span class="text-center text-sm font-bold text-accent" aria-hidden="true">→</span>
            <div class="min-w-0 rounded-md border border-border bg-surface px-2.5 py-2"><span class="block text-[9px] font-semibold uppercase tracking-wide text-text-subtle">Target volume</span><span class="mt-0.5 block truncate text-xs font-semibold text-text-primary" title="${esc(tgt)}">${esc(tgt)}</span></div>
          </div>`
        }).join('')}
        <p class="text-[11px] text-accent">▸ Show technical JSON</p>
      </div>
    </details>`).join('')}</div>`
}

const volumeLayerHeader = inv => groupHeader(`Volume inventory <span class="font-mono text-xs font-normal text-text-subtle">· ${esc(inv.provider_id_volume)}</span>`, 'Auxiliary volumes and their FlashCopy snapshot mappings.')
const mmLayerHeader = () => groupHeader('Metro Mirror', 'Synchronous replication of master volumes to auxiliary volumes.')

// ---------------------------------------------------------------------------
// Variant C: replication chain (master → aux → FlashCopy), one row per mapping
// ---------------------------------------------------------------------------
function chain(mm, inv) {
  const mappings = mm.mappings ?? []
  if (mm.error || mappings.length === 0) return ''
  const pages = Math.max(1, Math.ceil(mappings.length / PAGE))
  mmPage = Math.min(mmPage, pages)
  const visible = mappings.slice((mmPage - 1) * PAGE, mmPage * PAGE)
  const cols = '@min-[560px]/detail-content:grid-cols-[minmax(0,0.9fr)_6.5rem_minmax(0,1.3fr)_6rem]'
  return `<div>
    <div class="mb-2 flex items-baseline justify-between gap-3">
      <h4 class="text-[13px] font-semibold leading-5 text-text-primary">Replication chain</h4>
      <span class="text-xs text-text-muted">Master → auxiliary → snapshots</span>
    </div>
    <div class="overflow-hidden rounded-lg border border-border">
      <div class="hidden gap-x-3 border-b border-border bg-surface-muted/70 px-4 py-2 text-[11px] font-medium text-text-muted dark:bg-surface-muted/50 @min-[560px]/detail-content:grid ${cols}">
        <span>Master volume</span><span class="text-accent">Metro Mirror</span><span>Auxiliary volume</span><span class="text-brand-500 dark:text-brand-400">FlashCopy</span>
      </div>
      <ul class="divide-y divide-border/70">${visible.map(m => {
        const v = inv.volumes[m.auxiliary_volume]
        const snaps = v ? v.relations.length : null
        const label = typeof m.progress === 'number' ? `${m.progress} %` : stateTone(m.state) === 'success' ? '✓ In sync' : humanize(m.state ?? 'unknown')
        return `<li class="grid grid-cols-[minmax(0,1fr)] gap-y-1.5 px-4 py-3 ${cols} @min-[560px]/detail-content:items-center @min-[560px]/detail-content:gap-x-3">
          <span class="min-w-0 truncate text-sm font-medium text-text-primary" title="${esc(m.master_volume)}">${esc(m.master_volume)}</span>
          <div class="min-w-0 rounded-md px-2 py-1 ${TONE[stateTone(m.state)]}" title="${esc(m.state)}">
            <div class="truncate text-[11px] font-medium">→ ${esc(label)}</div>
            ${typeof m.progress === 'number' ? `<div class="mt-1 h-1 overflow-hidden rounded-full bg-surface/70"><div class="h-full rounded-full bg-current" style="width:${m.progress}%"></div></div>` : ''}
          </div>
          <span class="flex min-w-0 items-center gap-2"><span class="min-w-0 truncate text-sm text-text-primary" title="${esc(m.auxiliary_volume)}">${esc(m.auxiliary_volume)}</span>${v ? '' : badge('warning', 'Not in inventory')}</span>
          ${snaps === null ? '<span class="text-xs text-text-subtle">—</span>' : `<button type="button" data-goto="${esc(m.auxiliary_volume)}" class="justify-self-start rounded text-xs text-brand-500 hover:underline dark:text-brand-400">→ ${snaps} snapshot${snaps === 1 ? '' : 's'}</button>`}
        </li>`
      }).join('')}</ul>
    </div>
    ${pages > 1 ? `<p class="mt-2 text-xs text-text-muted">Page ${mmPage} of ${pages} · ${Array.from({ length: pages }, (_, i) => `<button type="button" data-page="${i + 1}" class="${i + 1 === mmPage ? 'font-semibold text-accent' : 'hover:underline'}">${i + 1}</button>`).join(' ')}</p>` : ''}
  </div>`
}

// ---------------------------------------------------------------------------
// Variant D: refined chain (selected direction)
// ---------------------------------------------------------------------------
// Inline summary instead of KPI tiles: "4 volumes · 4 found · 8 FlashCopy relations".
function inventoryLine(inv) {
  const vols = Object.values(inv.volumes)
  const found = vols.filter(v => v.found).length
  const rel = vols.reduce((t, v) => t + v.relations.length, 0)
  const missing = vols.length - found
  return `${vols.length} volumes · ${missing ? `<span class="text-warning-600 dark:text-orange-400">${found} found</span>` : `${found} found`} · ${rel} FlashCopy relations`
}

// Status block, DetailStatusBlock anatomy: status → facts → reference. Kept compact.
function dStatusBlock(mm) {
  const cg = mm.consistency_group
  const refRow = `<div class="flex flex-wrap items-center gap-x-6 gap-y-2 border-t border-border/70 px-4 py-2.5 text-xs">
    ${mm.queried_provider_id ? `<span class="flex min-w-0 items-center gap-2"><span class="text-text-muted">Queried provider</span><span class="min-w-0 font-mono text-[12px] text-text-secondary wrap-anywhere">${esc(mm.queried_provider_id)}</span><button type="button" class="flex size-6 items-center justify-center rounded-md text-text-subtle hover:bg-surface-hover hover:text-text-primary" aria-label="Copy queried provider">${svg(ICON.copy, 'size-3.5')}</button></span>` : ''}
    ${mm.mode ? `<span class="flex items-center gap-2"><span class="text-text-muted">Mode</span><span class="font-medium text-text-secondary">${esc(humanize(mm.mode))}</span></span>` : ''}
  </div>`
  if (mm.error) {
    return `<section class="rounded-xl border border-border" data-tone="warning">
      <div class="px-4 py-3.5">
        <div class="flex flex-wrap items-center gap-x-3 gap-y-2">${tonePill('warning', 'Status unavailable')}<span class="text-sm text-text-secondary">Metro Mirror state could not be read.</span></div>
        <p class="mt-2 font-mono text-[12px] text-text-secondary wrap-anywhere">${esc(mm.error)}</p>
        <p class="mt-1 text-xs text-text-muted">Replication status is collected best-effort. Auxiliary volumes and FlashCopy below are not affected.</p>
      </div>${refRow}
    </section>`
  }
  if (!cg) return ''
  const mappings = mm.mappings ?? []
  const total = cg.relationship_count ?? mappings.length
  return `<section class="rounded-xl border border-border" data-tone="${stateTone(cg.state)}">
    <div class="flex flex-wrap items-center gap-x-4 gap-y-2 px-4 py-3.5">
      ${tonePill(stateTone(cg.state), cg.state ? humanize(cg.state) : 'Unknown state')}
      <span class="min-w-0 text-sm text-text-secondary">Consistency group <strong class="font-semibold text-text-primary">${esc(cg.name ?? cg.id)}</strong> <span class="font-mono text-xs text-text-subtle">#${esc(cg.id)}</span></span>
    </div>
    <dl class="grid grid-cols-2 gap-x-8 gap-y-3 border-t border-border/70 px-4 py-3 ${cg.freeze_time ? '@min-[560px]/detail-content:grid-cols-[minmax(0,1.4fr)_minmax(0,1fr)_minmax(0,1fr)_minmax(0,1.3fr)]' : '@min-[560px]/detail-content:grid-cols-[minmax(0,1.4fr)_minmax(0,1fr)_minmax(0,1fr)]'}">
      <div class="col-span-2 min-w-0 @min-[560px]/detail-content:col-span-1"><dt class="text-xs text-text-muted">Progress</dt><dd class="mt-1">${progress(cg.progress, cg.state, 'Consistency group progress')}</dd></div>
      ${field('Primary', esc(humanize(cg.primary ?? '—')))}
      ${field('Relationships', mappings.length === total ? String(total) : `${mappings.length} of ${total}`)}
      ${cg.freeze_time ? field('Frozen at', `<span class="font-mono text-[12.5px] text-text-secondary">${esc(cg.freeze_time)}</span>`) : ''}
    </dl>${refRow}
  </section>`
}

// ---------------------------------------------------------------------------
// D2 · relationship-graph language (mirrors src/shared/components/relationship-graph)
// ---------------------------------------------------------------------------
// RelationshipNode chip tones, copied 1:1.
const CHIP = {
  storage: 'bg-accent-soft text-accent',
  protection: 'bg-theme-pink-500/10 text-theme-pink-500 dark:bg-theme-pink-500/20',
  problem: 'bg-error-50 text-error-600 dark:bg-error-500/15 dark:text-error-500',
}
const STATE_TEXT = { success: 'text-success-600 dark:text-success-500', error: 'text-error-600 dark:text-error-500', warning: 'text-warning-600 dark:text-orange-400', info: 'text-blue-light-500', neutral: 'text-text-secondary' }
// Technical names break after "_" / "-" before anywhere else, so "auxb099da7e_" and
// "V5000_VOLUME01" land on separate lines instead of an ellipsis eating the suffix.
const breakable = name => esc(name).replace(/([_-])/g, '$1<wbr>')
const tip = cls => `<svg viewBox="0 0 10 10" aria-hidden="true" class="absolute size-2.5 fill-current ${cls}"><path d="M0 0 10 5 0 10z"/></svg>`

// RelationshipNode: chip, name, meta. `action` turns it into a button (proposed generic
// "activatable node"); otherwise it is a focusable labelled group like in production.
function graphNode({ icon, tone, name, meta, action, label, title }) {
  const problem = tone === 'problem'
  const cls = `group/node block w-full min-w-0 rounded-xl border px-3 py-2.5 text-left outline-none transition-[opacity,border-color,box-shadow] duration-150 hover:border-accent focus-visible:border-accent focus-visible:ring-2 focus-visible:ring-focus/30 ${problem ? 'border-dashed border-error-500 bg-surface-subtle' : 'border-border bg-surface'}`
  const body = `<span class="flex min-w-0 items-start gap-2">
      <span class="grid size-6.5 shrink-0 place-items-center rounded-lg ${CHIP[tone]}">${svg(ICON[icon], 'size-3.75')}</span>
      <span class="line-clamp-2 min-w-0 flex-1 pt-0.5 text-[13px] leading-[1.15rem] font-semibold text-text-primary [overflow-wrap:anywhere] ${action ? 'group-hover/node:text-accent group-hover/node:underline group-focus-visible/node:text-accent' : ''}" title="${esc(title ?? name)}">${breakable(name)}</span>
    </span>
    ${meta ? `<span class="mt-1.5 flex min-w-0 flex-wrap items-center gap-x-1.5 gap-y-1 text-[11px] text-text-muted">${meta}</span>` : ''}`
  return action
    ? `<button type="button" ${action} aria-label="${esc(label)}" class="${cls} cursor-pointer">${body}</button>`
    : `<div role="group" tabindex="0" aria-label="${esc(label)}" class="${cls}">${body}</div>`
}
const roleTag = text => `<span class="rounded bg-surface-muted px-1 py-px text-[10px] font-medium text-text-secondary">${text}</span>`

// RelationshipNote: a neutral end of a row, never an error.
const graphNote = (text, span = 1) => `<p class="px-1 text-xs italic text-text-subtle @min-[40rem]/relationship-graph:pl-3 ${span === 2 ? '@min-[40rem]/relationship-graph:col-span-2' : ''}">${text}</p>`

// Metro Mirror connector (proposed `replication` edge with status + progress). The line is
// the progress track: fill = reported %, solid = in sync, dashed = not reported / problem.
// Wide rows run left → right; narrow rows run down a spine under the node chips.
function replicationConnector(m) {
  const tone = stateTone(m.state)
  const problem = tone === 'error'
  const reversed = m.primary === 'aux'
  const numeric = typeof m.progress === 'number'
  const pct = numeric ? Math.max(0, Math.min(100, m.progress)) : 0
  const value = numeric ? `${m.progress} %` : tone === 'success' ? 'In sync' : '—'
  const valueSr = numeric || tone === 'success' ? '' : '<span class="sr-only">progress not reported</span>'
  const baseLabel = m.state ? humanize(m.state) : 'Unknown state'
  const stateLabel = baseLabel + (reversed ? ' · reversed' : '')
  const line = problem ? 'text-error-500' : 'text-accent'
  const style = numeric ? 'progress' : tone === 'success' ? 'solid' : 'dashed'
  const wideTrack = style === 'dashed'
    ? `<span class="absolute inset-x-1.5 top-1/2 -translate-y-1/2 border-t-2 border-dashed border-current"></span>`
    : `<span class="absolute inset-x-1.5 top-1/2 h-0.5 -translate-y-1/2 rounded-full ${style === 'solid' ? 'bg-current' : 'bg-current/25'}"></span>
       ${style === 'progress' ? `<span class="absolute top-1/2 h-0.5 -translate-y-1/2 rounded-full bg-current ${reversed ? 'right-1.5' : 'left-1.5'}" style="width:calc((100% - 0.75rem) * ${pct / 100})"></span>` : ''}`
  const narrowTrack = style === 'dashed'
    ? `<span class="absolute inset-y-1 left-1/2 -translate-x-1/2 border-l-2 border-dashed border-current"></span>`
    : `<span class="absolute inset-y-1 left-1/2 w-0.5 -translate-x-1/2 rounded-full ${style === 'solid' ? 'bg-current' : 'bg-current/25'}"></span>
       ${style === 'progress' ? `<span class="absolute left-1/2 w-0.5 -translate-x-1/2 rounded-full bg-current ${reversed ? 'bottom-1' : 'top-1'}" style="height:calc((100% - 0.5rem) * ${pct / 100})"></span>` : ''}`
  const sr = `Metro Mirror ${reversed ? 'from auxiliary to master' : 'from master to auxiliary'}: ${stateLabel}, ${numeric ? `${m.progress} percent` : tone === 'success' ? 'in sync' : 'progress not reported'}`
  return `<div class="min-w-0" data-edge-kind="replication" role="img" aria-label="${esc(sr)}">
    <div aria-hidden="true" class="hidden px-1 @min-[40rem]/relationship-graph:block">
      <div class="flex items-baseline justify-between gap-1 text-[10.5px] leading-4 font-semibold"><span class="truncate ${problem ? 'text-error-600 dark:text-error-500' : 'text-accent'}">Metro Mirror</span><span class="shrink-0 tabular-nums ${numeric ? 'text-text-secondary' : tone === 'success' ? STATE_TEXT.success : 'text-text-subtle'}">${value}</span></div>
      <div class="relative h-2.5 ${line}">${wideTrack}${tip(reversed ? 'left-0.5 top-1/2 -translate-y-1/2 rotate-180' : 'right-0.5 top-1/2 -translate-y-1/2')}</div>
      <p class="truncate text-[10.5px] leading-4 font-medium ${STATE_TEXT[tone]}" title="${esc(stateLabel)}">${esc(baseLabel)}</p>
    </div>
    <div aria-hidden="true" class="flex min-h-13 items-stretch gap-2.5 pl-3.5 @min-[40rem]/relationship-graph:hidden">
      <span class="relative w-2.5 shrink-0 ${line}">${narrowTrack}${tip(reversed ? 'top-0 left-1/2 -translate-x-1/2 -rotate-90' : 'bottom-0 left-1/2 -translate-x-1/2 rotate-90')}</span>
      <span class="min-w-0 py-1.5 text-[11px] leading-4"><span class="block font-semibold ${problem ? 'text-error-600 dark:text-error-500' : 'text-accent'}">Metro Mirror</span><span class="block ${STATE_TEXT[tone]}">${esc(stateLabel)} <span class="text-text-subtle">·</span> <span class="${numeric ? 'font-semibold tabular-nums text-text-secondary' : tone === 'success' ? '' : 'text-text-subtle'}">${numeric || tone === 'success' ? value : 'progress not reported'}</span></span></span>
    </div>
    ${valueSr}
  </div>`
}

// FlashCopy connector (proposed `protection` edge kind: the pink of the protection node tone).
function protectionConnector() {
  return `<div class="min-w-0" data-edge-kind="protection" role="img" aria-label="FlashCopy from auxiliary volume to snapshots">
    <div aria-hidden="true" class="hidden px-1 text-theme-pink-500 @min-[40rem]/relationship-graph:block">
      <p class="truncate text-center text-[10.5px] leading-4 font-semibold">FlashCopy</p>
      <div class="relative h-2.5"><span class="absolute inset-x-1.5 top-1/2 h-0.5 -translate-y-1/2 rounded-full bg-current/70"></span>${tip('right-0.5 top-1/2 -translate-y-1/2')}</div>
      <p class="h-4" aria-hidden="true"></p>
    </div>
    <div aria-hidden="true" class="flex h-9 items-stretch gap-2.5 pl-3.5 text-theme-pink-500 @min-[40rem]/relationship-graph:hidden">
      <span class="relative w-2.5 shrink-0"><span class="absolute inset-y-1 left-1/2 w-0.5 -translate-x-1/2 rounded-full bg-current/70"></span>${tip('bottom-0 left-1/2 -translate-x-1/2 rotate-90')}</span>
      <span class="self-center text-[11px] font-semibold">FlashCopy</span>
    </div>
  </div>`
}

function chainRow(m, inv, cgPrimary) {
  const aux = m.auxiliary_volume ?? '—'
  const master = m.master_volume ?? '—'
  const v = inv.volumes[aux]
  const primary = m.primary ?? cgPrimary
  const masterNode = graphNode({ icon: 'disk', tone: 'storage', name: master, label: `Master volume ${master}`,
    meta: `<span>Master</span>${primary === 'master' ? roleTag('Primary') : ''}` })
  const auxMeta = !v ? `<span class="text-error-600 dark:text-error-500">Not in inventory</span>`
    : `<span>Auxiliary</span>${primary === 'aux' ? roleTag('Primary') : ''}${v.found ? '' : '<span class="basis-full text-error-600 dark:text-error-500">Not found on provider</span>'}`
  const auxNode = graphNode({ icon: v ? 'disk' : 'alert', tone: v && v.found ? 'storage' : 'problem', name: aux, meta: auxMeta,
    label: v ? `Auxiliary volume ${aux}, show inventory details` : `Auxiliary volume ${aux}, not in inventory`,
    action: v ? `data-goto="${esc(aux)}"` : '' })
  let tail
  if (!v) tail = graphNote('No inventory data', 2)
  else if (!v.found) tail = graphNote('No FlashCopy data', 2)
  else if (v.relations.length === 0) tail = protectionConnector() + graphNote('No snapshots')
  else {
    const n = v.relations.length
    tail = protectionConnector() + graphNode({ icon: 'copy', tone: 'protection', name: String(n),
      meta: `<span>snapshot${n === 1 ? '' : 's'}</span>`, title: `${n} FlashCopy snapshot${n === 1 ? '' : 's'}`, label: `${n} FlashCopy snapshots of ${aux}, show mappings`, action: `data-goto="${esc(aux)}"` })
  }
  // RelationshipChain grid, widened for the richer replication connector.
  return `<li data-chain-row="${esc(aux)}" data-hl="${esc(aux)}" data-highlight="idle" class="grid min-w-0 grid-cols-1 gap-1 p-3 transition-opacity duration-150 data-[highlight=off]:opacity-35 @min-[40rem]/relationship-graph:grid-cols-[minmax(0,1fr)_7.5rem_minmax(0,1fr)_4.25rem_6.25rem] @min-[40rem]/relationship-graph:items-center @min-[40rem]/relationship-graph:gap-0">
    ${masterNode}${replicationConnector(m)}${auxNode}${tail}
  </li>`
}

function d2Chain(mm, inv) {
  const mappings = mm.mappings ?? []
  if (mm.error) return ''
  if (!mm.consistency_group && mappings.length === 0) {
    return `<p class="rounded-xl border border-dashed border-border px-4 py-3 text-sm text-text-muted">No Metro Mirror consistency group or mappings were reported for this run.</p>`
  }
  if (mappings.length === 0) return `<p class="text-sm text-text-muted">The consistency group reported no volume mappings.</p>`
  const cg = mm.consistency_group
  const pages = Math.max(1, Math.ceil(mappings.length / PAGE))
  mmPage = Math.min(mmPage, pages)
  const start = (mmPage - 1) * PAGE
  const visible = mappings.slice(start, start + PAGE)
  const legend = `<span class="flex items-center gap-3 text-[10.5px] font-semibold normal-case tracking-normal" aria-hidden="true">
    <span class="flex items-center gap-1.5 text-accent"><span class="h-0.5 w-4 rounded-full bg-current"></span>Metro Mirror</span>
    <span class="flex items-center gap-1.5 text-theme-pink-500"><span class="h-0.5 w-4 rounded-full bg-current/70"></span>FlashCopy</span>
  </span>`
  const pager = pages > 1 ? `<nav class="flex items-center justify-between gap-3 border-t border-border px-3 py-2 text-xs text-text-muted" aria-label="Replication chain pages">
    <span>${start + 1}–${start + visible.length} of ${mappings.length} mappings</span>
    <span class="flex items-center gap-1">
      <button type="button" data-page="${mmPage - 1}" ${mmPage === 1 ? 'disabled' : ''} aria-label="Previous page" class="grid size-8 place-items-center rounded-lg border border-border text-text-secondary hover:bg-surface-hover disabled:opacity-40">${svg('<path d="m12.5 5-5 5 5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>', 'size-3.5')}</button>
      ${Array.from({ length: pages }, (_, i) => `<button type="button" data-page="${i + 1}" aria-label="Page ${i + 1}" ${i + 1 === mmPage ? 'aria-current="page"' : ''} class="grid size-8 place-items-center rounded-lg text-sm ${i + 1 === mmPage ? 'bg-accent font-semibold text-white' : 'border border-border text-text-secondary hover:bg-surface-hover'}">${i + 1}</button>`).join('')}
      <button type="button" data-page="${mmPage + 1}" ${mmPage === pages ? 'disabled' : ''} aria-label="Next page" class="grid size-8 place-items-center rounded-lg border border-border text-text-secondary hover:bg-surface-hover disabled:opacity-40">${svg('<path d="m7.5 5 5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>', 'size-3.5')}</button>
    </span>
  </nav>` : ''
  // RelationshipGraph container + RelationshipGroup (eyebrow header, dashed row dividers).
  return `<div class="@container/relationship-graph">
    <section class="overflow-hidden rounded-xl border border-border">
      <header class="flex flex-wrap items-center justify-between gap-x-4 gap-y-1 border-b border-border bg-surface-muted px-3 py-2">
        <h5 id="chain-title" class="text-[11px] font-semibold uppercase tracking-wider text-text-muted">Replication chain${cg ? ` · <span class="normal-case">${esc(cg.name ?? cg.id)}</span>` : ''}</h5>${legend}
      </header>
      <ul aria-labelledby="chain-title" class="divide-y divide-dashed divide-border" data-chain>${visible.map(m => chainRow(m, inv, cg?.primary)).join('')}</ul>
      ${pager}
    </section>
  </div>`
}

// Lower half of the chain. Header stays outside the bounded scroll; only relations scroll.
function d2Volumes(inv, openName) {
  const entries = Object.entries(inv.volumes)
  if (entries.length === 0) return '<p class="text-sm text-text-muted">No inventory items were returned.</p>'
  const cols = 'grid-cols-[minmax(0,1fr)_4.75rem_minmax(0,1fr)]'
  const miniNode = (icon, tone, name) => `<span class="flex min-w-0 items-center gap-1.5 rounded-lg border border-border bg-surface px-1.5 py-1">
    <span class="grid size-4.5 shrink-0 place-items-center rounded ${CHIP[tone]}">${svg(ICON[icon], 'size-3')}</span>
    <span class="min-w-0 truncate font-mono text-[11.5px] text-text-secondary" title="${esc(name)}">${esc(name)}</span></span>`
  return `<ul class="divide-y divide-border/60 border-y border-border/60">${entries.map(([name, v]) => {
    const n = v.relations.length
    const count = `${n} FlashCopy relation${n === 1 ? '' : 's'}`
    return `<li data-inv-row="${esc(name)}" data-hl="${esc(name)}" data-highlight="idle" class="rounded-lg transition-colors data-[highlight=on]:bg-accent-soft/50 dark:data-[highlight=on]:bg-accent-soft/40">
    <details id="vol-${esc(name)}" class="group scroll-mt-4"${name === openName ? ' open' : ''}>
      <summary class="grid cursor-pointer list-none grid-cols-[1rem_1.625rem_minmax(0,1fr)_auto] items-center gap-x-2.5 rounded-lg px-1 py-2.5 hover:bg-surface-hover/60 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-focus/15 @min-[600px]/detail-content:grid-cols-[1rem_1.625rem_minmax(0,1fr)_auto_auto]">
        <span class="text-text-subtle transition-transform -rotate-90 group-open:rotate-0">${svg(ICON.chevron)}</span>
        <span class="grid size-6.5 place-items-center rounded-lg ${v.found ? CHIP.storage : CHIP.problem}">${svg(ICON[v.found ? 'disk' : 'alert'], 'size-3.75')}</span>
        <span class="min-w-0"><span class="block truncate text-[13px] font-semibold text-text-primary" title="${esc(name)}">${esc(name)}</span><span class="block text-[11px] text-text-muted @min-[600px]/detail-content:hidden">${count}</span></span>
        <span class="hidden text-xs text-text-muted @min-[600px]/detail-content:inline">${count}</span>
        ${badge(v.found ? 'success' : 'error', v.found ? 'Found' : 'Not found')}
      </summary>
      <div class="mb-3 ml-[3.375rem] mr-1 overflow-hidden rounded-xl border border-border">
        ${n === 0 ? '<p class="px-3 py-2.5 text-xs italic text-text-subtle">No FlashCopy mappings were returned.</p>' : `
        <div class="custom-scrollbar max-h-60 overflow-y-auto overscroll-contain" tabindex="0" role="region" aria-label="FlashCopy mappings of ${esc(name)}" data-relations>
          <div class="sticky top-0 z-1 grid ${cols} items-center gap-x-2 border-b border-border bg-surface-muted px-3 py-1.5 text-[11px] font-medium text-text-muted">
            <span>Source</span><span class="text-center font-semibold text-theme-pink-500">FlashCopy</span><span>Target snapshot</span>
          </div>
          <ul class="divide-y divide-dashed divide-border">${v.relations.map(r => {
            const paired = r.paired_volume.name
            const src = r.role === 'source' ? name : paired, tgt = r.role === 'target' ? name : paired
            return `<li class="grid ${cols} items-center gap-x-2 px-3 py-1.5">
              ${miniNode('disk', 'storage', src)}
              <span class="relative h-2.5 text-theme-pink-500" aria-label="FlashCopy to"><span class="absolute inset-x-1 top-1/2 h-0.5 -translate-y-1/2 rounded-full bg-current/70"></span>${tip('right-0 top-1/2 -translate-y-1/2')}</span>
              ${miniNode('copy', 'protection', tgt)}
            </li>`
          }).join('')}</ul>
        </div>`}
        <div class="flex items-center justify-between gap-3 border-t border-border px-3 py-1.5 text-[11px] text-text-muted"><span>${n > 6 ? `${n} relations · scroll for more` : ''}</span><button type="button" class="text-accent hover:underline">Show technical JSON</button></div>
      </div>
    </details></li>`
  }).join('')}</ul>`
}

function dInventoryBody(mm, inv) {
  const parts = []
  if (mm) {
    parts.push(`<section>
      ${groupHeader('Metro Mirror', 'Replication from master volumes to auxiliary volumes.')}
      ${dStatusBlock(mm)}
    </section>`)
    const chainHtml = d2Chain(mm, inv)
    if (chainHtml) parts.push(`<section>
      ${groupHeader('Replication chain', 'Each master volume, its Metro Mirror replica and the replica’s FlashCopy snapshots.')}
      ${chainHtml}
    </section>`)
  }
  parts.push(`<section${mm ? ' class="border-t border-border/70 pt-7"' : ''}>
    ${groupHeader(`Auxiliary volume inventory <span class="font-mono text-xs font-normal text-text-subtle">· ${esc(inv.provider_id_volume)}</span>`, 'Auxiliary volumes and their FlashCopy snapshot mappings.')}
    ${d2Volumes(inv, state.openVolume)}
  </section>`)
  return parts.join('')
}

// ---------------------------------------------------------------------------
// Sections per variant
// ---------------------------------------------------------------------------
let state = { variant: 'd', scenario: 'copying', size: 'lg', compact: false, active: null, openVolume: null }

function sections() {
  const mm = SCENARIOS[state.scenario]
  const inv = state.variant === 'd' ? inventoryFor(state.scenario) : INVENTORY
  const names = new Set(Object.keys(inv.volumes))
  const list = [
    { id: 'overview', title: 'Overview', icon: 'grid', description: 'Configuration and workload of the recovery group.', body: () => overviewBody() },
    { id: 'orchestration', title: 'Orchestration', icon: 'execution', description: 'Latest orchestrated run of this group.', body: () => orchestrationBody() },
  ]
  const mmCount = mm ? (mm.error ? `<span class="text-warning-600 dark:text-orange-400" title="Metro Mirror status unavailable">${svg(ICON.alert, 'size-3.5')}</span>` : String(mm.mappings.length)) : null

  if (state.variant === 'b' && mm) {
    list.push({ id: 'metro-mirror', title: 'Metro Mirror', icon: 'refresh', count: mmCount,
      description: 'Synchronous replication of master volumes to auxiliary volumes.',
      body: () => [mmStatusBlock(mm), mmMappings(mm, names)].filter(Boolean).join('') })
  }
  if (state.variant === 'd') {
    list.push({ id: 'inventory', title: 'Inventory', icon: 'server', count: '4', description: inventoryLine(inv),
      aside: `<span class="font-mono text-[11px] text-text-subtle" title="Run ID">${esc(inv.run_id)}</span>`,
      body: () => dInventoryBody(mm, inv) })
  } else list.push({ id: 'inventory', title: 'Inventory', icon: 'server', count: '4', description: 'VMs: 4',
    body: () => {
      const parts = [inventorySummary(inv)]
      if (state.variant === 'a' && mm) parts.push(layer(mmLayerHeader() + `<div class="flex flex-col gap-5">${[mmStatusBlock(mm), mmMappings(mm, names)].filter(Boolean).join('')}</div>`, true))
      if (state.variant === 'c' && mm) parts.push(layer(mmLayerHeader() + `<div class="flex flex-col gap-5">${[mmStatusBlock(mm), chain(mm, inv) || mmMappings(mm, names)].filter(Boolean).join('')}</div>`, true))
      if (state.variant === 'b' && mm) parts.push(`<p class="-mt-2 text-xs text-text-muted">Replication from master volumes is shown in <button type="button" data-section="metro-mirror" class="text-accent hover:underline">Metro Mirror</button>.</p>`)
      parts.push(layer(volumeLayerHeader(inv) + volumeDetails(inv, state.openVolume), !(mm && state.variant !== 'b')))
      return parts.join('')
    } })
  list.push({ id: 'technical', title: 'Technical', icon: 'api', secondary: true, description: 'Identifiers for support and integrations.', body: () => technicalBody(mm) })
  return list
}

const overviewBody = () => `<section>${groupHeader('General')}<dl class="grid grid-cols-1 gap-x-10 gap-y-5 @min-[520px]/detail-content:grid-cols-2">${field('Description', 'rdb_and_app')}${field('Policy Set', '<strong class="font-semibold">test_1_hour_ps</strong>')}</dl></section>
  <section class="border-t border-border/70 pt-7">${groupHeader('Workload')}<dl class="grid grid-cols-1 gap-x-10 gap-y-5 @min-[520px]/detail-content:grid-cols-2">${field('Source Category', 'Compute workloads')}${field('Workload Type', 'VMware virtual machines')}${field('Resource Type', 'VM')}${field('Resources', '4')}</dl></section>`
const orchestrationBody = () => `<section class="rounded-xl border border-border"><div class="px-5 py-4"><h4 class="text-xs text-text-muted">Latest run</h4><div class="mt-2 flex items-center gap-3">${tonePill('success', 'Success')}<span class="text-sm text-text-secondary">10 s</span></div></div></section>`
const techRow = (k, v) => `<div class="grid grid-cols-[minmax(8rem,12rem)_minmax(0,1fr)] items-baseline gap-x-4 border-t border-border/60 px-4 py-2.5 first:border-t-0"><dt class="text-xs text-text-muted">${k}</dt><dd class="min-w-0 font-mono text-[12.5px] text-text-secondary wrap-anywhere">${esc(v)}</dd></div>`
const technicalBody = mm => `<section>${groupHeader('Recovery group')}<dl class="overflow-hidden rounded-lg bg-surface-muted/70 dark:bg-surface-muted/50">${techRow('Group ID', 'rdb_and_app')}${techRow('Consistency group ID', '55')}</dl></section>
  ${mm ? `<section>${groupHeader('Metro Mirror')}<dl class="overflow-hidden rounded-lg bg-surface-muted/70 dark:bg-surface-muted/50">${techRow('Queried provider', mm.queried_provider_id ?? '—')}${techRow('Mode', mm.mode ?? '—')}</dl></section>` : ''}`

// ---------------------------------------------------------------------------
// DetailView frame (classes copied from DetailView.tsx)
// ---------------------------------------------------------------------------
function render() {
  const list = sections()
  const ordered = [...list.filter(s => !s.secondary), ...list.filter(s => s.secondary)]
  const active = list.find(s => s.id === state.active) ?? list.find(s => s.id === (state.variant === 'b' ? 'metro-mirror' : 'inventory')) ?? list[0]
  state.active = active.id
  const compact = state.compact
  const tall = new URLSearchParams(location.search).has('tall')
  const dialog = document.getElementById('dialog')
  dialog.dataset.mode = compact ? 'compact' : 'expanded'
  dialog.className = 'fixed z-50 flex flex-col overflow-hidden bg-surface ' + (compact
    ? 'inset-y-0 top-12.25 right-0 w-[min(420px,92vw)] border-l border-border shadow-[-14px_0_40px_-20px_rgba(20,35,70,0.4)] [--detail-gutter:1.25rem]'
    : `top-[calc(50%+24px)] left-1/2 ${tall ? '' : 'h-[min(46rem,calc(100dvh-5rem))]'} ${state.size === 'xl' ? 'w-[min(75rem,calc(100vw-2rem))]' : 'w-[min(60rem,calc(100vw-2rem))]'} -translate-x-1/2 -translate-y-1/2 rounded-2xl border border-border shadow-lg [--detail-gutter:1.25rem] sm:[--detail-gutter:2rem]`)
  if (tall && !compact) { dialog.classList.replace('fixed', 'absolute'); dialog.classList.replace('-translate-y-1/2', 'translate-y-0'); dialog.classList.replace('top-[calc(50%+24px)]', 'top-20') }
  document.getElementById('backdrop').className = `fixed inset-0 top-12.25 z-40 ${compact ? 'bg-black/45' : 'bg-black/30'}`

  hl.hover = null; hl.focus = null
  dialog.innerHTML = `
    <header class="flex shrink-0 items-start gap-3 border-b border-border px-5 py-4 sm:px-6">
      <div class="min-w-0 flex-1">
        <p class="text-xs font-medium text-text-muted">Recovery group</p>
        <div class="mt-0.5 flex min-w-0 flex-wrap items-center gap-x-3 gap-y-1.5">
          <h2 class="line-clamp-2 min-w-0 text-lg font-semibold leading-7 text-text-primary wrap-anywhere">rdb_and_app</h2>
          ${badge('success', 'Active')}
          <span class="min-w-0 text-xs text-text-muted">Last run: success · 10s</span>
        </div>
      </div>
      <div class="flex shrink-0 items-center gap-1">
        <button type="button" id="mode" class="hidden h-8 items-center gap-1.5 rounded-lg px-2.5 text-xs font-medium text-text-secondary transition hover:bg-surface-hover hover:text-text-primary sm:inline-flex">${svg(compact ? ICON.max : ICON.panel, 'size-3.5')}${compact ? 'Expand' : 'Compact view'}</button>
        <span class="flex size-8 items-center justify-center text-text-muted">${svg(ICON.help)}</span>
        <button type="button" aria-label="Close recovery group" class="flex size-8 items-center justify-center rounded-lg text-text-muted hover:bg-surface-hover hover:text-text-primary">${svg(ICON.close)}</button>
      </div>
    </header>
    <div class="flex min-h-0 flex-1 flex-col ${compact ? '' : 'sm:flex-row'}">
      <nav aria-label="Sections" class="flex shrink-0 flex-wrap gap-1 border-b border-border px-4 py-2 ${compact ? '' : 'sm:w-52 sm:flex-col sm:flex-nowrap sm:overflow-y-auto sm:border-r sm:border-b-0 sm:px-3 sm:py-4'}">
        ${ordered.map(s => {
          const sel = s === active
          return `<button type="button" data-section="${s.id}" ${sel ? 'aria-current="true"' : ''} class="flex shrink-0 items-center gap-2 rounded-lg px-2.5 py-1.5 text-left text-[13px] leading-5 transition ${sel ? 'bg-accent-soft font-semibold text-accent' : 'font-medium text-text-secondary hover:bg-surface-hover hover:text-text-primary'} ${compact ? '' : 'sm:gap-2.5 sm:px-3 sm:py-2'} ${s.secondary && !compact ? 'sm:mt-auto' : ''}">
            <span class="${sel ? '' : 'text-text-subtle'}">${svg(ICON[s.icon])}</span>
            <span class="min-w-0 flex-1 whitespace-nowrap sm:whitespace-normal">${s.title}</span>
            ${s.count ? `<span class="text-[11px] tabular-nums ${sel ? '' : 'text-text-subtle'}">${s.count}</span>` : ''}
          </button>`
        }).join('')}
      </nav>
      <div id="content" role="region" aria-labelledby="section-title" class="custom-scrollbar min-h-0 min-w-0 flex-1 overflow-y-auto @container/detail-content px-(--detail-gutter) py-6">
        <header class="mb-6 flex items-start gap-4"><div class="min-w-0 flex-1">
          <h3 id="section-title" class="text-base font-semibold leading-6 text-text-primary">${active.title}</h3>
          <p class="mt-0.5 text-[13px] text-text-muted">${active.description}</p>
        </div>${active.aside ? `<div class="flex shrink-0 items-center gap-2 pt-1">${active.aside}</div>` : ''}</header>
        <div class="flex flex-col gap-7">${active.body()}</div>
      </div>
    </div>
    <footer class="flex shrink-0 flex-wrap items-center gap-x-3 gap-y-2 border-t border-border px-5 py-3 sm:px-6">
      <button type="button" class="h-9 rounded-lg border border-error-200 px-3.5 text-sm font-medium text-error-600 dark:border-error-500/40 dark:text-error-500">Delete</button>
      <div class="flex min-w-0 flex-1 justify-end"><button type="button" class="h-9 rounded-lg bg-accent px-3.5 text-sm font-semibold text-white">Edit</button></div>
    </footer>`
  if (state.openVolume) document.getElementById(`vol-${state.openVolume}`)?.scrollIntoView({ block: 'center' })
}

// ---------------------------------------------------------------------------
// Interactions
// ---------------------------------------------------------------------------
// Row-scoped highlight shared by the chain and the auxiliary inventory: hover wins over
// keyboard focus, like RelationshipGraph; leaving falls back to the focused row.
const hl = { hover: null, focus: null }
function applyHighlight() {
  const key = hl.hover ?? hl.focus
  document.querySelectorAll('[data-chain-row]').forEach(row => { row.dataset.highlight = key === null ? 'idle' : row.dataset.chainRow === key ? 'on' : 'off' })
  document.querySelectorAll('[data-inv-row]').forEach(row => { row.dataset.highlight = key !== null && row.dataset.invRow === key ? 'on' : 'idle' })
  // A key without a chain row on this page must not dim the whole chain.
  if (key !== null && !document.querySelector(`[data-chain-row="${CSS.escape(key)}"]`)) document.querySelectorAll('[data-chain-row]').forEach(row => { row.dataset.highlight = 'idle' })
}
const dialogEl = document.getElementById('dialog')
dialogEl.addEventListener('pointerover', e => { const key = e.target.closest('[data-hl]')?.dataset.hl ?? null; if (key !== hl.hover) { hl.hover = key; applyHighlight() } })
dialogEl.addEventListener('pointerleave', () => { hl.hover = null; applyHighlight() })
dialogEl.addEventListener('focusin', e => { hl.focus = e.target.closest('[data-hl]')?.dataset.hl ?? null; applyHighlight() })
dialogEl.addEventListener('focusout', e => { if (!dialogEl.contains(e.relatedTarget)) { hl.focus = null; applyHighlight() } })

function revealVolume(details) {
  details.open = true
  details.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' })
  const summary = details.querySelector('summary')
  summary.focus({ preventScroll: true })
  hl.focus = details.closest('[data-hl]')?.dataset.hl ?? null
  applyHighlight()
}
document.getElementById('dialog').addEventListener('click', e => {
  const sec = e.target.closest('[data-section]')
  if (sec) { state.active = sec.dataset.section; state.openVolume = null; render(); return }
  const page = e.target.closest('[data-page]')
  if (page) {
    // Keep the reader at the chain: restore the scroll position after re-rendering.
    const top = document.getElementById('content').scrollTop
    mmPage = Number(page.dataset.page); render()
    document.getElementById('content').scrollTop = top
    return
  }
  const go = e.target.closest('[data-goto]')
  if (go) {
    const target = document.getElementById(`vol-${go.dataset.goto}`)
    // Same section: open and reveal the volume in place, no re-render and no new dialog.
    if (target) { revealVolume(target); return }
    state.active = 'inventory'; state.openVolume = go.dataset.goto; render(); return
  }
  if (e.target.closest('#mode')) { state.compact = !state.compact; document.getElementById('compact').checked = state.compact; render() }
})
const params = new URLSearchParams(location.search)
const bind = (id, key, prop = 'value') => {
  const el = document.getElementById(id)
  if (params.has(key)) el[prop] = prop === 'checked' ? true : params.get(key)
  el.addEventListener('change', () => { state[key] = el[prop]; if (key !== 'compact') { state.active = null; state.openVolume = null; mmPage = 1 } render() })
  state[key] = el[prop]
}
bind('variant', 'variant'); bind('scenario', 'scenario'); bind('size', 'size'); bind('compact', 'compact', 'checked')
const dark = document.getElementById('dark')
dark.checked = params.has('dark')
const applyDark = () => document.documentElement.classList.toggle('dark', dark.checked)
dark.addEventListener('change', applyDark); applyDark()
if (params.get('section')) state.active = params.get('section')
render()
</script>
</body>
