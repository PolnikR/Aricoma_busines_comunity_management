<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recovery App Policy — návrh neaktívnych polí</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f7f9fc; --surface: #fff; --surface-subtle: #fbfdff;
      --surface-muted: #f1f6fb; --text-primary: #17233d; --text-secondary: #3b4763;
      --text-helper: #536581; --border: #dbe7f2; --border-strong: #c8d7e7;
      --accent: #0d91d7; --accent-soft: #e8f6fd; --focus: #1596dd;
      --notice-text: #355d78; --notice-bg: #edf4f8;
      font-family: Arial, Helvetica, sans-serif; color: var(--text-primary); background: var(--page);
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 2rem 1rem; }
    .preview-note { max-width: 48rem; margin: 0 auto 1rem; color: var(--text-helper); font-size: .75rem; line-height: 1.5; }
    .preview-note strong { color: var(--text-secondary); }
    main { max-width: 48rem; margin: auto; background: var(--surface); border: 1px solid var(--border); border-radius: .75rem; box-shadow: 0 .5rem 2rem rgb(23 35 61 / 7%); }
    header { padding: 1.5rem; border-bottom: 1px solid var(--border); }
    h1 { margin: 0; font-size: 1.125rem; line-height: 1.5; }
    .intro { margin: .5rem 0 0; font-size: .875rem; color: var(--text-helper); line-height: 1.5; }
    .content { padding: 1.5rem; display: grid; gap: 1.25rem; }
    .columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; align-items: start; }
    .field { min-width: 0; }
    label, .field-label { display: block; margin-bottom: .5rem; color: var(--text-secondary); font-size: .8125rem; font-weight: 500; }
    .label-row { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin-bottom: .5rem; min-height: 1.5rem; }
    .label-row label { margin: 0; }
    .badge { display: inline-flex; align-items: center; padding: .25rem .5rem; border-radius: .25rem; background: var(--notice-bg); color: var(--notice-text); font-size: .6875rem; font-weight: 600; line-height: 1.25; }
    input:not([type="checkbox"]), select, textarea { display: block; width: 100%; min-width: 0; padding: .75rem; border: 1px solid var(--border-strong); border-radius: .75rem; background: var(--surface-subtle); color: var(--text-secondary); font: inherit; font-size: .875rem; line-height: 1.25rem; box-shadow: 0 1px 2px rgb(23 35 61 / 6%); }
    input[readonly] { background: var(--surface-muted); color: var(--text-helper); }
    textarea { min-height: 4.5rem; resize: vertical; }
    .interval { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: .5rem; }
    .section { background: var(--surface-subtle); border: 1px solid var(--border); border-radius: .5rem; padding: 1rem; }
    h2 { margin: 0 0 1rem; font-size: .875rem; line-height: 1.5; }
    input[type="checkbox"] { width: 1rem; height: 1rem; margin: .25rem 0 0; flex: none; accent-color: var(--accent); }
    .boot-control { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; min-height: 2.5rem; }
    .boot-control input { margin: 0 .25rem 0 0; }
    .boot-control label { margin: 0; cursor: pointer; }
    .status-control { display: flex; align-items: center; gap: .75rem; min-height: 3rem; }
    .status-control label { margin: 0; }
    .status-control input { margin: 0; }
    footer { border-top: 1px solid var(--border); padding: 1rem 1.5rem; display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: .75rem; }
    button { border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-secondary); border-radius: .5rem; min-height: 2.75rem; padding: .5rem 1rem; cursor: pointer; font: inherit; font-size: .8125rem; font-weight: 600; }
    button:hover { background: var(--surface-muted); }
    .help-button { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 2rem; min-height: 2rem; padding: 0; border: 0; border-radius: .5rem; background: transparent; color: var(--text-helper); }
    .help-button span { display: inline-flex; align-items: center; justify-content: center; width: .875rem; height: .875rem; border: 1px solid currentColor; border-radius: 50%; font-size: .625rem; }
    .help-button[aria-expanded="true"] { background: var(--accent-soft); color: var(--text-primary); }
    .help-panel { position: fixed; z-index: 10; width: min(22rem, calc(100vw - 1rem)); max-height: calc(100dvh - 1rem); overflow-y: auto; padding: 1rem; border: 1px solid var(--border-strong); border-radius: .75rem; background: var(--surface); box-shadow: 0 .5rem 1.5rem rgb(23 35 61 / 15%); }
    .help-panel-heading { display: flex; align-items: center; gap: .5rem; }
    .help-panel h2 { flex: 1; margin: 0; }
    .help-panel p { margin: .75rem 0 0; font-size: .75rem; color: var(--text-secondary); line-height: 1.6; }
    .primary { background: var(--accent-soft); border-color: var(--border-strong); color: var(--text-primary); }
    .primary:hover { background: var(--surface-muted); }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    #save-status { flex-basis: 100%; margin: 0; color: var(--text-helper); font-size: .75rem; line-height: 1.5; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    @media (max-width: 36rem) {
      body { padding: 1rem .5rem; }
      .columns { grid-template-columns: minmax(0, 1fr); }
      header, .content { padding: 1rem; }
      footer { padding: 1rem; }
      footer button { flex: 1; }
    }
  </style>
</head>
<body>
  <p class="preview-note"><strong>Vizuálny návrh</strong> · Recovery App Policies · Samostatný náhľad, hodnoty sa nikam neodosielajú.</p>
  <main aria-labelledby="page-title">
    <header>
      <h1 id="page-title">Upraviť politiku obnovy aplikácie</h1>
      <p class="intro">Nastavte frekvenciu testov obnovy a spôsob výberu snímky.</p>
    </header>
    <form id="policy-form">
      <div class="content">
        <div class="columns">
          <div class="field"><label for="policy-id">ID politiky</label><input id="policy-id" value="critical-daily-latest" readonly></div>
          <div class="field"><label for="policy-name">Názov politiky</label><input id="policy-name" value="Critical - Daily" required></div>
        </div>
        <div class="field"><label for="description">Popis</label><textarea id="description">Denný test obnovy s najnovšou dostupnou FlashCopy snímkou.</textarea></div>
        <div class="columns">
          <div class="field">
            <div class="label-row"><label for="frequency">Frekvencia</label><button type="button" class="help-button" data-help="frequency-help" aria-label="Nápoveda k frekvencii" aria-haspopup="dialog" aria-expanded="false" aria-controls="help-panel"><span aria-hidden="true">?</span></button></div>
            <div class="interval">
              <input id="frequency" type="number" min="1" step="1" value="1" required>
              <label class="sr-only" for="frequency-unit">Jednotka frekvencie</label>
              <select id="frequency-unit"><option value="days">dni</option><option value="hours">hodiny</option></select>
            </div>
          </div>
          <div class="field">
            <div class="label-row"><label for="retention">Retention</label><button type="button" class="help-button" data-help="retention-help" aria-label="Nápoveda k uchovaniu" aria-haspopup="dialog" aria-expanded="false" aria-controls="help-panel"><span aria-hidden="true">?</span></button><span class="badge" id="retention-note">Zatiaľ sa nepoužíva</span></div>
            <div class="interval">
              <input id="retention" type="number" min="1" step="1" value="4" aria-describedby="retention-note" required>
              <label class="sr-only" for="retention-unit">Jednotka uchovania</label>
              <select id="retention-unit" aria-describedby="retention-note"><option value="hours">hodiny</option><option value="days">dni</option></select>
            </div>
          </div>
        </div>
        <section class="section" aria-labelledby="snapshot-title">
          <h2 id="snapshot-title">Výber snímky</h2>
          <div class="label-row"><label for="snapshot">Spôsob výberu</label><button type="button" class="help-button" data-help="snapshot-help" aria-label="Nápoveda k výberu snímky" aria-haspopup="dialog" aria-expanded="false" aria-controls="help-panel"><span aria-hidden="true">?</span></button></div>
          <select id="snapshot"><option value="latest">Najnovšia dostupná snímka</option></select>
        </section>
        <div class="boot-control">
          <input id="boot-verify" type="checkbox" aria-describedby="boot-note">
          <label for="boot-verify">Boot verification</label>
          <button type="button" class="help-button" data-help="boot-help" aria-label="Nápoveda k overeniu spustenia" aria-haspopup="dialog" aria-expanded="false" aria-controls="help-panel"><span aria-hidden="true">?</span></button>
          <span class="badge" id="boot-note">Zatiaľ sa nepoužíva</span>
        </div>
        <div class="columns">
          <div class="field"><div class="label-row"><label for="level">Úroveň</label><button type="button" class="help-button" data-help="level-help" aria-label="Nápoveda k úrovni" aria-haspopup="dialog" aria-expanded="false" aria-controls="help-panel"><span aria-hidden="true">?</span></button></div><select id="level"><option>Critical</option><option>High</option><option>Medium</option><option>Low</option></select></div>
          <div class="status-control"><input id="enabled" type="checkbox" checked><label for="enabled">Politika povolená</label><button type="button" class="help-button" data-help="enabled-help" aria-label="Nápoveda k povoleniu politiky" aria-haspopup="dialog" aria-expanded="false" aria-controls="help-panel"><span aria-hidden="true">?</span></button></div>
        </div>
      </div>
      <footer>
        <button type="reset">Obnoviť hodnoty</button>
        <button type="submit" class="primary">Vyskúšať uloženie</button>
        <p id="save-status" role="status" aria-live="polite"></p>
      </footer>
    </form>
  </main>
  <div id="help-panel" class="help-panel" role="dialog" aria-labelledby="help-title" tabindex="-1" hidden>
    <div class="help-panel-heading"><h2 id="help-title"></h2><button type="button" id="close-help" class="help-button" aria-label="Zavrieť nápovedu">×</button></div>
    <p id="help-text"></p>
  </div>
  <template id="frequency-help" data-title="Frekvencia">Určuje interval plánovaných testov obnovy aplikácie. Pri manuálnom zónovaní alebo manuálnom zadaní WWPN sa obnova spúšťa ručne.</template>
  <template id="retention-help" data-title="Retention">Zamýšľaná doba ponechania obnovenej aplikácie v cieľovom prostredí. Hodnota aj jednotka sa ukladajú pre budúce použitie. Aktuálny recovery DAG ich nepoužíva a po uplynutí tejto doby aplikáciu automaticky neodstráni.</template>
  <template id="snapshot-help" data-title="Výber snímky">Určuje, ktorú dostupnú snímku použiť pri obnove. V tejto ukážke je vybraná najnovšia dostupná snímka.</template>
  <template id="boot-help" data-title="Boot verification">Požaduje overenie štartu obnovenej aplikácie. Nastavenie sa ukladá pre budúce použitie, ale aktuálne DAG šablóny ho nepoužívajú. Zaškrtnutie preto nezapne kontrolu spustenia.</template>
  <template id="level-help" data-title="Úroveň">Označenie priority politiky, napríklad Critical alebo High. Samotná úroveň nemení postup obnovy.</template>
  <template id="enabled-help" data-title="Politika povolená">Uložený stav politiky. Samotná táto voľba nezaručuje pozastavenie alebo opätovné spustenie už nasadeného DAG.</template>
  <script>
    const panel = document.querySelector('#help-panel');
    let helpTrigger;
    function closeHelp(returnFocus = false) {
      panel.hidden = true;
      helpTrigger?.setAttribute('aria-expanded', 'false');
      if (returnFocus) helpTrigger?.focus();
    }
    function placeHelp() {
      if (panel.hidden) return;
      const anchor = helpTrigger.getBoundingClientRect();
      const left = Math.max(8, Math.min(anchor.left, innerWidth - panel.offsetWidth - 8));
      const top = anchor.bottom + panel.offsetHeight + 16 <= innerHeight
        ? anchor.bottom + 8 : Math.max(8, anchor.top - panel.offsetHeight - 8);
      panel.style.left = left + 'px';
      panel.style.top = top + 'px';
    }
    document.querySelectorAll('[data-help]').forEach(button => {
      button.addEventListener('click', () => {
        closeHelp();
        helpTrigger = button;
        const content = document.getElementById(button.dataset.help);
        document.querySelector('#help-title').textContent = content.dataset.title;
        document.querySelector('#help-text').textContent = content.content.textContent;
        panel.hidden = false;
        button.setAttribute('aria-expanded', 'true');
        placeHelp();
        panel.focus();
      });
    });
    document.querySelector('#close-help').addEventListener('click', () => closeHelp(true));
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !panel.hidden) { event.preventDefault(); closeHelp(true); }
    });
    document.addEventListener('pointerdown', event => {
      if (!panel.contains(event.target) && !event.target.closest('[data-help]')) closeHelp();
    });
    window.addEventListener('resize', placeHelp);
    window.addEventListener('scroll', placeHelp, true);
    const form = document.querySelector('#policy-form');
    const status = document.querySelector('#save-status');
    form.addEventListener('submit', event => {
      event.preventDefault();
      status.textContent = 'Ukážka uloženia: Retention ' + document.querySelector('#retention').value + ' ' + document.querySelector('#retention-unit').selectedOptions[0].text + ', Boot verification: ' + (document.querySelector('#boot-verify').checked ? 'áno' : 'nie') + '. Žiadne údaje sa neodoslali.';
    });
    form.addEventListener('reset', () => { status.textContent = ''; });
  </script>
</body>
</html>
